<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sem conexão</title>
<link rel="icon" href="/icons/favicon.svg" />
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F0E7;color:#292521;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  img{width:64px;height:64px}
  h1{font-size:1.5rem;margin:16px 0 8px}
  p{color:#5f574e;margin:0 0 24px}
  button{min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#A3480D;color:#fff;font-weight:700;font-size:1rem}
</style>
</head>
<body>
<main>
  <img src="/icons/favicon.svg" alt="" />
  <h1>Você está sem conexão</h1>
  <p>Assim que a internet voltar, as informações do bairro aparecem atualizadas.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
