<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;color:#292521">
  <h2>Redefinir senha</h2>
  <p>Recebemos um pedido para redefinir sua senha. Toque no botão abaixo para escolher uma nova:</p>
  <p><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#A3480D;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:bold">Escolher nova senha</a></p>
  <p style="color:#5f574e;font-size:13px">Se você não pediu, ignore esta mensagem; sua senha continua a mesma.</p>
</div>
