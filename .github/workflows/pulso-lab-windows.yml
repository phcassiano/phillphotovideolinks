name: "Pulso Lab: gerar instalador do Windows"

on:
  push:
    paths:
      - "pulso-lab/**"
      - ".github/workflows/pulso-lab-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulso-lab-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pulso-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pulso-lab/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulso-lab/src-tauri

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes do backend
        working-directory: pulso-lab/src-tauri
        run: cargo test

      - name: Gerar o instalador
        run: npx tauri build

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Pulso-Lab-Windows
          path: pulso-lab/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
