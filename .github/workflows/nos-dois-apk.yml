name: "Nós Dois: gerar APK Android"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Endereço do site no Vercel (https://...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nos-dois/android-app
    env:
      SITE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Conferir o Android SDK da máquina
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" | tail -5

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Configurar o endereço do site
        run: node scripts/configure.js

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícones do app
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../site/icons/android-$d.png "$RES/mipmap-$d/ic_launcher.png"
            cp ../site/icons/android-$d.png "$RES/mipmap-$d/ic_launcher_round.png"
            rm -f "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Gerar APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../nos-dois.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nos-dois-apk
          path: nos-dois/android-app/nos-dois.apk
          if-no-files-found: error
