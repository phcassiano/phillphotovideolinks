name: Sexta-feira DMG

on:
  push:
    paths:
      - "sexta-feira-mac/**"
      - ".github/workflows/sexta-feira-dmg.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Swift
        run: swift --version
      - name: Compilar e gerar DMG
        working-directory: sexta-feira-mac
        run: ./make-dmg.sh
      - name: Publicar DMG
        uses: actions/upload-artifact@v4
        with:
          name: Sexta-feira-dmg
          path: sexta-feira-mac/build/Sexta-feira.dmg
          retention-days: 30
