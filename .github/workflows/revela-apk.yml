name: "Revela: gerar APK"

on:
  workflow_dispatch:
  push:
    paths:
      - "sony-tether/**"
      - ".github/workflows/revela-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sony-tether
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Chave de assinatura (dos segredos do repositório)
        env:
          KEYSTORE_B64: ${{ secrets.REVELA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REVELA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/revela-release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=revela\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/revela-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
            echo "REVELA_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem REVELA_KEYSTORE_B64: o APK sai sem assinatura."
          fi

      - name: Testes e APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk Revela.apk

      - uses: actions/upload-artifact@v4
        with:
          name: revela-apk
          path: sony-tether/Revela.apk
          if-no-files-found: error
