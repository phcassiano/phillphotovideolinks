[package]
name = "pulso-lab"
version = "0.1.0"
description = "Pulso Lab: limpa, otimiza e cuida da saúde do seu PC"
edition = "2021"
publish = false

[lib]
name = "pulso_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.40"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
