<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<title>Painel · Phill Cassiano</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161616'/%3E%3Ccircle cx='32' cy='34' r='13' fill='none' stroke='%23f4f3ef' stroke-width='5'/%3E%3Crect x='22' y='14' width='20' height='8' rx='3' fill='%23f4f3ef'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--panel2:#f9f8f5;--ink:#1b1b1a;--muted:#6f6d67;--line:#e6e3dc;
  --dark:#161616;--dark-ink:#f4f3ef;--dark-muted:#a9a69e;
  --accent:#2f6b4f;--accent-soft:#e3efe8;--red:#b23b2e;--red-soft:#f8e3df;--amber:#9a6a12;--amber-soft:#f8edd6;
  --blue:#2d5b8a;--blue-soft:#e2ebf5;--violet:#6a4c93;--violet-soft:#ece5f5;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111;--panel:#1a1a1a;--panel2:#202020;--ink:#ecebe6;--muted:#9c9a93;--line:#2c2c2a;
  --dark:#262624;--dark-ink:#f4f3ef;--dark-muted:#b0ada5;
  --accent:#6fbf96;--accent-soft:#1c3328;--red:#ec7d6f;--red-soft:#3a1f1b;--amber:#e0b259;--amber-soft:#382c14;
  --blue:#82aede;--blue-soft:#1b2838;--violet:#b49be0;--violet-soft:#2a2238;--shadow:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111111;--panel:#1a1a1a;--panel2:#202020;--ink:#ecebe6;--muted:#9c9a93;--line:#2c2c2a;
  --dark:#262624;--dark-ink:#f4f3ef;--dark-muted:#b0ada5;
  --accent:#6fbf96;--accent-soft:#1c3328;--red:#ec7d6f;--red-soft:#3a1f1b;--amber:#e0b259;--amber-soft:#382c14;
  --blue:#82aede;--blue-soft:#1b2838;--violet:#b49be0;--violet-soft:#2a2238;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font:400 30px/1.15 var(--serif);letter-spacing:-.01em}
h2{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hide{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--bg);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--dark);display:grid;place-items:center;color:var(--dark-ink);font-weight:700;font-size:13px}
.brand b{display:block;font-size:13px}.brand span{font-size:11px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a.on{background:var(--dark);color:var(--dark-ink)}
.nav a .n{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:0 6px;line-height:17px}
.nav svg{width:17px;height:17px;flex:none}
.side .grow{flex:1}
.sync{font-size:11px;color:var(--muted);padding:8px 10px;display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}.sync.err i{background:var(--red)}.sync.busy i{background:var(--amber)}
main{min-width:0;padding:28px 32px 80px;max-width:1400px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top .sub{color:var(--muted);margin-top:4px}
.mobilebar{display:none}

/* parts */
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.btn.pri:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .act{margin-left:auto}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font:400 26px/1.2 var(--serif);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.dark{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.kpi.dark .lbl,.kpi.dark .foot{color:var(--dark-muted)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.kpi.dark .bar{background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.kpi.dark .bar i{background:#8fd3ae}
.alert{background:var(--dark);color:var(--dark-ink);border-radius:var(--radius);padding:16px 18px}
.alert h2{font-size:14px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.alert ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.alert li{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.alert li:hover{opacity:.8}
.alert .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:#e0b259}
.alert .dot.r{background:#ec7d6f}.alert .dot.g{background:#8fd3ae}
.list{display:grid;gap:2px}
.li{display:flex;gap:10px;align-items:center;padding:8px;border-radius:9px;cursor:pointer;min-width:0}
.li:hover{background:var(--panel2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.datebox{width:42px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;padding:3px 0;background:var(--panel2)}
.datebox b{display:block;font:400 17px/1.1 var(--serif)}.datebox span{font-size:10px;color:var(--muted);text-transform:uppercase}
.empty{color:var(--muted);font-size:13px;padding:12px 8px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--accent-soft);color:var(--accent)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.sel{border-color:var(--ink);color:var(--ink)}
button.chip{cursor:pointer}
.check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;cursor:pointer;background:transparent;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.quickadd{display:flex;gap:6px;margin-top:8px}
.quickadd input{flex:1;min-width:0}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--ink)}
textarea.in{min-height:80px;resize:vertical}
.search{max-width:260px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--muted);outline-offset:-4px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:600;font-size:13px}
.col-h .c{color:var(--muted);font-weight:500}
.col-h .sum{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.col-h i{width:8px;height:8px;border-radius:50%;flex:none}
.kcards{display:grid;gap:8px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow)}
.kc:hover{border-color:var(--muted)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:600;margin-bottom:2px}
.kc .s{font-size:12px;color:var(--muted)}
.kc .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.kc .val{margin-left:auto;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bk{display:inline-flex;gap:2px}
.bk b{font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.bk b.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.modal-h h3{font:400 22px/1.2 var(--serif);flex:1}
.modal-b{padding:10px 20px 6px}
.modal-f{display:flex;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--line);margin-top:14px;flex-wrap:wrap}
.modal-f .sp{flex:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px;font-weight:600;color:var(--muted)}
.form .hint{font-size:11px;color:var(--muted)}
.sec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.lines{display:grid;gap:6px}
.line{display:grid;gap:6px;align-items:center}
.line.pay{grid-template-columns:1.3fr 1fr 1fr auto auto}
.line.item{grid-template-columns:2.4fr .6fr 1fr auto}
.line .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.toggles label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer}
.total{display:flex;justify-content:flex-end;gap:16px;font-size:13px;margin-top:6px}
.total b{font:400 20px var(--serif)}

/* misc */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:10px 16px;border-radius:10px;z-index:80;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:11px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.pcard .price{font:400 22px var(--serif);margin:6px 0}
.pcard .price.todo{color:var(--muted);font-size:16px;font-family:var(--sans);font-style:italic}
.pcard pre,.prompt pre{white-space:pre-wrap;font:inherit;margin:0;color:var(--muted);font-size:13px}
.prompt pre{max-height:140px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.note{border-radius:var(--radius);padding:14px;cursor:pointer;border:1px solid var(--line);min-height:110px}
.note pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;max-height:180px;overflow:hidden}
.chart{width:100%;height:180px;display:block}
.chart text{fill:var(--muted);font-size:11px}
.catbar{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.catbar .bar{margin:0}
.catbar .bar i{background:var(--red)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{max-width:380px;width:100%;padding:28px}
.login h1{margin:10px 0 6px}

/* print (orçamento em PDF) */
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block!important;position:absolute;inset:0;padding:0;background:#fff;color:#111}
  @page{margin:18mm}
}
.doc{font:13px/1.5 var(--sans);color:#111;background:#fff;max-width:760px;margin:0 auto}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:20px}
.doc .dh h1{font:400 30px var(--serif);color:#111}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#555;border-bottom:1px solid #ccc;padding:6px 4px}
.doc td{padding:8px 4px;border-bottom:1px solid #eee;vertical-align:top}
.doc .num{text-align:right;white-space:nowrap}
.doc .tot td{border:0;padding:4px}
.doc .grand td{font:400 20px var(--serif);border-top:2px solid #111;padding-top:8px}
.doc .box{background:#f5f4f0;border-radius:8px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
.preview-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;overflow:auto;padding:30px 16px}
.preview-bg .paper{background:#fff;border-radius:12px;padding:40px;max-width:840px;margin:0 auto}
.preview-bar{max-width:840px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .mobilebar{display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:30}
  .mobilebar b{flex:1}
  main{padding:18px 16px 80px}
  h1{font-size:25px}
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:21px}
  .form{grid-template-columns:minmax(0,1fr)}
  .line.pay{grid-template-columns:1fr 1fr;}
  .line.item{grid-template-columns:1fr 70px 100px auto}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .search{max-width:none;flex:1}
  .catbar{grid-template-columns:90px 1fr 80px}
  .preview-bg .paper{padding:20px}
}
.scrim{display:none}
@media (max-width:820px){.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const money = (n) => BRL.format(Number(n) || 0);
const moneyShort = (n) => { n = Number(n) || 0; return Math.abs(n) >= 10000 ? "R$ " + (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : money(n); };
function parseMoney(s) {
  if (s == null) return null;
  s = String(s).replace(/[R$\s]/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const moneyIn = (n) => (n == null || n === "" ? "" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parseD = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000); // a - b
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MESF = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const fmtD = (s) => { if (!s) return ""; const d = parseD(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + (d.getFullYear() !== new Date().getFullYear() ? "/" + String(d.getFullYear()).slice(2) : ""); };
const fmtDW = (s) => s ? WD[parseD(s).getDay()] + ", " + fmtD(s) : "";
function rel(s) {
  if (!s) return "";
  const n = diffDays(s, today());
  if (n === 0) return "hoje"; if (n === 1) return "amanhã"; if (n === -1) return "ontem";
  return n > 0 ? "em " + n + " dias" : "há " + -n + " dias";
}
const weekStart = (s = today()) => { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const monthKey = (s) => String(s || "").slice(0, 7);
const tsDay = (ts) => iso(new Date(ts));
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

/* ================= dados e sincronização ================= */
const COLS = ["jobs", "quotes", "clients", "finance", "prices", "prompts", "notes", "tasks", "settings"];
const K = { data: "painel_v1_data", pend: "painel_v1_pending", key: "painel_v1_key", mode: "painel_v1_mode" };
const DB = { data: {}, pending: LS.get(K.pend, {}), mode: "boot", status: "", key: LS.get(K.key, "") };
(() => { const saved = LS.get(K.data, {}); for (const c of COLS) DB.data[c] = saved[c] || {}; })();
const persist = () => { LS.set(K.data, DB.data); LS.set(K.pend, DB.pending); };
const all = (col) => Object.values(DB.data[col] || {}).filter((x) => !x._del);
const get = (col, id) => { const x = DB.data[col][id]; return x && !x._del ? x : null; };
function save(col, item, opts = {}) {
  if (!item.id) item.id = uid();
  if (!item.createdAt) item.createdAt = Date.now();
  item.updatedAt = Date.now();
  DB.data[col][item.id] = item;
  DB.pending[col + "|" + item.id] = item.updatedAt;
  persist(); scheduleFlush();
  if (!opts.silent) render();
  return item;
}
function remove(col, id) { const x = DB.data[col][id]; if (!x) return; save(col, { id, _del: true, createdAt: x.createdAt }); }
const settings = () => get("settings", "main") || {};

async function api(op, extra = {}) {
  const r = await fetch("/api/data", { method: "POST", headers: { "content-type": "application/json", "x-painel-key": DB.key || "" }, body: JSON.stringify({ op, ...extra }) });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || "Erro " + r.status); e.status = r.status; throw e; }
  return j;
}
function setSync(s) { DB.status = s; const el = $("#sync"); if (el) paintSync(el); }
function paintSync(el) {
  const s = DB.status;
  const m = DB.mode === "local" ? ["", "Só neste aparelho"] : s === "busy" ? ["busy", "Salvando…"] : s === "err" ? ["err", "Sem conexão, tentando de novo"] : ["ok", "Sincronizado"];
  el.className = "sync " + m[0]; el.innerHTML = "<i></i>" + m[1];
}
let flushTimer = null, flushing = false;
function scheduleFlush(ms = 700) { if (DB.mode !== "online") return; clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  if (DB.mode !== "online" || flushing) return;
  const keys = Object.keys(DB.pending);
  if (!keys.length) { setSync("ok"); return; }
  flushing = true; setSync("busy");
  const batch = keys.slice(0, 200).map((k) => { const [col, id] = k.split("|"); return { col, item: DB.data[col][id], k, v: DB.pending[k] }; }).filter((x) => x.item);
  try {
    const r = await api("put", { items: batch.map(({ col, item }) => ({ col, item })) });
    for (const b of batch) if (DB.pending[b.k] === b.v) delete DB.pending[b.k];
    for (const k of r.kept || []) { DB.data[k.col][k.item.id] = k.item; delete DB.pending[k.col + "|" + k.item.id]; }
    persist(); setSync("ok");
    if ((r.kept || []).length) render();
  } catch (e) {
    setSync("err");
    if (e.status === 401) return logout("Sua senha mudou. Entre de novo.");
    flushing = false; return scheduleFlush(8000);
  }
  flushing = false;
  if (Object.keys(DB.pending).length) scheduleFlush(300);
}
async function pull() {
  if (DB.mode !== "online") return;
  try {
    const r = await api("load");
    let changed = false;
    for (const c of COLS) for (const it of r.data[c] || []) {
      const mine = DB.data[c][it.id];
      if (DB.pending[c + "|" + it.id] && mine && (mine.updatedAt || 0) > (it.updatedAt || 0)) continue;
      if (!mine || (mine.updatedAt || 0) !== (it.updatedAt || 0)) { DB.data[c][it.id] = it; changed = true; }
    }
    persist();
    if (!Object.keys(DB.pending).length) setSync("ok");
    if (changed && !document.querySelector(".modal-bg")) render();
    return true;
  } catch (e) {
    if (e.status === 401) { logout("Senha incorreta."); return false; }
    setSync("err"); return false;
  }
}

const clientName = (id) => (get("clients", id) || {}).nome || "";
function payments() {
  const out = [];
  for (const j of all("jobs")) for (const p of j.pagamentos || []) out.push({ ...p, job: j, cliente: clientName(j.clienteId) });
  return out;
}
const payDay = (p) => p.pago ? (p.pagoEm || p.venc) : p.venc;
function received(from, to) { // entradas pagas entre datas (inclusive)
  let s = 0;
  for (const p of payments()) if (p.pago) { const d = payDay(p); if (d && d >= from && d <= to) s += Number(p.valor) || 0; }
  for (const f of all("finance")) if (f.tipo === "entrada" && f.pago !== false && f.data >= from && f.data <= to) s += Number(f.valor) || 0;
  return s;
}
const quoteTotal = (q) => { const sub = (q.itens || []).reduce((a, i) => a + (Number(i.qtd) || 1) * (Number(i.valor) || 0), 0); return Math.max(0, sub - (Number(q.desconto) || 0)); };
const jobPaid = (j) => (j.pagamentos || []).filter((p) => p.pago).reduce((a, p) => a + (Number(p.valor) || 0), 0);
function jobPayChip(j) {
  const v = Number(j.valor) || 0; const paid = jobPaid(j);
  if (!v && !(j.pagamentos || []).length) return "";
  if (v && paid >= v) return '<span class="chip green">Pago</span>';
  const late = (j.pagamentos || []).some((p) => !p.pago && p.venc && p.venc < today());
  if (late) return '<span class="chip red">Pagamento atrasado</span>';
  if (paid > 0) return '<span class="chip amber">Sinal pago</span>';
  return '<span class="chip">A receber</span>';
}
const jobDeadline = (j) => j.etapa === "concluido" ? null : (j.prazoEtapa || (["edicao", "entrega", "selecao", "backup", "captado"].includes(j.etapa) ? j.prazoEntrega : null));
function deadlineChip(d) {
  if (!d) return "";
  const n = diffDays(d, today());
  const cls = n < 0 ? "red" : n <= 2 ? "amber" : "";
  return `<span class="chip ${cls}">${n < 0 ? "Atrasado " + -n + "d" : "Prazo " + rel(d)}</span>`;
}
function alerts() {
  const t = today(), out = [];
  for (const p of payments()) if (!p.pago && p.venc && p.venc < t) out.push({ c: "r", txt: `Pagamento atrasado: ${money(p.valor)} de ${p.cliente || p.job.titulo} (${p.desc || "parcela"}, venceu ${rel(p.venc)})`, go: () => editJob(p.job.id) });
  for (const j of all("jobs")) {
    if (j.etapa === "concluido") continue;
    if (j.prazoEntrega && j.prazoEntrega < t && j.etapa !== "concluido") out.push({ c: "r", txt: `Entrega atrasada: ${j.titulo} (${rel(j.prazoEntrega)})`, go: () => editJob(j.id) });
    else if (j.prazoEtapa && j.prazoEtapa < t) out.push({ c: "r", txt: `Etapa "${stageName(JOB_STAGES, j.etapa)}" atrasada: ${j.titulo}`, go: () => editJob(j.id) });
    const b = j.backup || {};
    if (["captado", "backup", "selecao", "edicao"].includes(j.etapa) && !(b.hd1 && b.hd2 && b.nuvem)) out.push({ c: "", txt: `Backup incompleto: ${j.titulo} (${["hd1", "hd2", "nuvem"].filter((k) => !b[k]).map((k) => ({ hd1: "HD 1", hd2: "HD 2", nuvem: "nuvem" }[k])).join(", ")})`, go: () => editJob(j.id) });
  }
  for (const q of all("quotes")) if (["enviado", "negociando"].includes(q.etapa)) {
    const last = q.ultimoContato || q.enviadoEm;
    if (last && diffDays(t, last) >= 3) out.push({ c: "", txt: `Sem resposta há ${diffDays(t, last)} dias: orçamento de ${clientName(q.clienteId) || q.titulo}. Hora do follow-up.`, go: () => editQuote(q.id) });
  }
  for (const k of all("tasks")) if (!k.feita && k.prazo && k.prazo < t) out.push({ c: "r", txt: `Tarefa atrasada: ${k.texto}`, go: () => { location.hash = "#/notas"; UI.notesTab = "tarefas"; saveUI(); render(); } });

    for (const [d, label] of [[c.aniversario, "Aniversário"], [c.dataEspecial, c.dataEspecialDesc || "Data especial"]]) {

}

function field(f, v) {
  const id = "f_" + f.k;
  const wrap = (inner) => `<div class="f ${f.full ? "full" : ""}"><label for="${id}">${esc(f.label)}</label>${inner}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</div>`;
  if (f.type === "sec") return `<div class="sec">${esc(f.label)}</div>`;
  if (f.type === "html") return `<div class="f full">${f.html}</div>`;
  if (f.type === "textarea") return wrap(`<textarea class="in" id="${id}" name="${f.k}" placeholder="${esc(f.ph || "")}" ${f.rows ? `style="min-height:${f.rows * 22}px"` : ""}>${esc(v)}</textarea>`);
  if (f.type === "select") return wrap(`<select class="in" id="${id}" name="${f.k}">${(f.empty !== undefined ? `<option value="">${esc(f.empty)}</option>` : "") + f.opts.map((o) => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(lab)}</option>`; }).join("")}</select>`);
  if (f.type === "money") return wrap(`<input class="in" id="${id}" name="${f.k}" inputmode="decimal" placeholder="${esc(f.ph || "0,00")}" value="${esc(moneyIn(v))}">`);
  if (f.type === "client") return wrap(`<input class="in" id="${id}" name="${f.k}" list="dl_clients" autocomplete="off" placeholder="Nome do cliente (novo ou existente)" value="${esc(clientName(v))}"><datalist id="dl_clients">${all("clients").sort((a, b) => a.nome.localeCompare(b.nome)).map((c) => `<option value="${esc(c.nome)}">`).join("")}</datalist>`);
  if (f.type === "list") return wrap(`<input class="in" id="${id}" name="${f.k}" list="dl_${f.k}" autocomplete="off" placeholder="${esc(f.ph || "")}" value="${esc(v)}"><datalist id="dl_${f.k}">${f.opts.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>`);
  return wrap(`<input class="in" id="${id}" name="${f.k}" type="${f.type || "text"}" ${f.type === "number" ? 'inputmode="numeric"' : ""} placeholder="${esc(f.ph || "")}" value="${esc(v)}">`);
}
const formHTML = (fields, obj) => `<div class="form">${fields.map((f) => field(f, obj[f.k] ?? "")).join("")}</div>`;
function readForm(root, fields, obj) {
  for (const f of fields) {
    if (!f.k || f.type === "sec" || f.type === "html") continue;
    const el = root.querySelector(`[name="${f.k}"]`); if (!el) continue;
    let v = el.value.trim();
    if (f.type === "money") v = parseMoney(v);
    else if (f.type === "number") v = v === "" ? null : Number(v);
    else if (f.type === "client") v = resolveClient(v);
    obj[f.k] = v;
  }
  return obj;
}
function resolveClient(name) {
  name = String(name || "").trim(); if (!name) return "";
  const hit = all("clients").find((c) => c.nome.toLowerCase() === name.toLowerCase());
  if (hit) return hit.id;
  return save("clients", { nome: name }, { silent: true }).id;
}

function editJob(id, preset = {}) {
  const isNew = !id;
  const j = isNew ? { etapa: "agendado", pagamentos: [], backup: {}, ...preset } : JSON.parse(JSON.stringify(get("jobs", id)));
  const fields = jobFields();
  const b = j.backup || {};
  fields.find((f) => f.k === "_pays").html = payLines(j.pagamentos);
  fields.find((f) => f.k === "_backup").html = `<div class="toggles"><label><input type="checkbox" name="b_hd1" ${b.hd1 ? "checked" : ""}> HD 1</label><label><input type="checkbox" name="b_hd2" ${b.hd2 ? "checked" : ""}> HD 2</label><label><input type="checkbox" name="b_nuvem" ${b.nuvem ? "checked" : ""}> Nuvem</label><label><input type="checkbox" name="baixou" ${j.baixou ? "checked" : ""}> Cliente já baixou</label></div>`;
  const c = get("clients", j.clienteId);
  const extra = isNew ? "" : `<div class="row" style="margin-bottom:12px">${c && c.whatsapp ? `<a class="btn sm" target="_blank" rel="noopener" href="${waLink(c.whatsapp)}">WhatsApp do cliente</a>` : ""}<button class="btn sm" data-msg="${j.id}">Mensagens prontas</button>${j.quoteId && get("quotes", j.quoteId) ? `<button class="btn sm" data-openquote="${j.quoteId}">Ver orçamento</button>` : ""}</div>`;
  const bg = openModal({ title: isNew ? "Novo trabalho" : j.titulo || "Trabalho", wide: true, body: extra + formHTML(fields, j), foot: footer(isNew) });
  const servEl = $('[name="servico"]', bg);
  servEl.addEventListener("change", () => {
    const p = all("prices").find((x) => x.nome === servEl.value); if (!p) return;
    const v = $('[name="valor"]', bg); if (!v.value && p.preco) v.value = moneyIn(p.preco);
    const d = $('[name="data"]', bg).value, pe = $('[name="prazoEntrega"]', bg);
    if (d && !pe.value && p.prazoDias) pe.value = addDays(d, p.prazoDias);
    const t = $('[name="titulo"]', bg); if (!t.value) t.value = p.nome;
  });
  $('[name="data"]', bg).addEventListener("change", (e) => {
    const p = all("prices").find((x) => x.nome === servEl.value); const pe = $('[name="prazoEntrega"]', bg);
    if (p && p.prazoDias && !pe.value && e.target.value) pe.value = addDays(e.target.value, p.prazoDias);
  });
  bindLines(bg);
  $('[data-split]', bg).onclick = () => {
    const total = parseMoney($('[name="valor"]', bg).value);
    if (!total) return toast("Preencha o valor total primeiro");
    const half = Math.round((total / 2) * 100) / 100;
    $("#pays", bg).innerHTML = payLine({ desc: "Sinal (50%)", valor: half, venc: today() }) + payLine({ desc: "Saldo", valor: Math.round((total - half) * 100) / 100, venc: $('[name="prazoEntrega"]', bg).value || $('[name="data"]', bg).value || "" });
  };
  $("[data-save]", bg).onclick = () => {
    readForm(bg, fields, j);
    if (!j.titulo) return toast("Dê um título ao trabalho");
    j.pagamentos = readPays(bg, j.pagamentos);
    j.backup = { hd1: $('[name="b_hd1"]', bg).checked, hd2: $('[name="b_hd2"]', bg).checked, nuvem: $('[name="b_nuvem"]', bg).checked };
    j.baixou = $('[name="baixou"]', bg).checked;
    save("jobs", j, { silent: true }); closeModal(); toast("Trabalho salvo");
  };
  const del = $("[data-del]", bg); if (del) del.onclick = () => { if (confirmDel("este trabalho")) { remove("jobs", j.id); closeModal(); } };
}
function bindLines(bg) {
  bg.addEventListener("click", (e) => {
    if (e.target.closest("[data-rmline]")) e.target.closest(".line").remove();
    if (e.target.closest("[data-addpay]")) $("#pays", bg).insertAdjacentHTML("beforeend", payLine({}));
  });
}
function bindDrag() {
  let dragId = null;
  $$("[data-drag]").forEach((el) => {
    el.addEventListener("dragstart", (e) => { dragId = el.dataset.drag; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch {} });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); $$(".col.over").forEach((c) => c.classList.remove("over")); });
  });
  $$("[data-drop]").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", (e) => {
      e.preventDefault(); col.classList.remove("over");
      const id = dragId || e.dataTransfer.getData("text/plain"); if (!id) return;
      const kind = col.closest("[data-board]").dataset.board;
      if (kind === "jobs") { const j = get("jobs", id); if (j && j.etapa !== col.dataset.drop) { j.etapa = col.dataset.drop; j.prazoEtapa = ""; save("jobs", j); } }
      else { const q = get("quotes", id); if (q && q.etapa !== col.dataset.drop) moveQuote(q, col.dataset.drop); }
    });
  });
}

/* ================= ORÇAMENTOS ================= */
function nextQuoteNumber() { const n = all("quotes").reduce((m, q) => Math.max(m, Number(q.numero) || 0), 0); return n + 1; }
function moveQuote(q, etapa) {
  q.etapa = etapa;
  if (etapa === "enviado" && !q.enviadoEm) q.enviadoEm = today();
  if (etapa === "fechado") q.fechadoEm = q.fechadoEm || today();
  save("quotes", q);
  if (etapa === "fechado" && !q.jobId && confirm("Orçamento fechado! Criar o trabalho agora?")) convertQuote(q.id);
}
function viewQuotes() {
  const q = UI.quoteSearch.toLowerCase();
  const quotes = all("quotes").filter((x) => !q || [x.titulo, clientName(x.clienteId), x.origem].join(" ").toLowerCase().includes(q));
  const t = today(), mk = monthKey(t);
  const open = all("quotes").filter((x) => ["lead", "enviado", "negociando"].includes(x.etapa));
  const wonM = all("quotes").filter((x) => x.etapa === "fechado" && monthKey(x.fechadoEm || "") === mk);
  const won = all("quotes").filter((x) => x.etapa === "fechado").length, lost = all("quotes").filter((x) => x.etapa === "perdido").length;
  const conv = won + lost ? Math.round((won / (won + lost)) * 100) + "%" : "—";
  const bySource = {}; for (const x of all("quotes")) if (x.etapa === "fechado") { const o = x.origem || "Sem origem"; bySource[o] = (bySource[o] || 0) + quoteTotal(x); }
  const topSrc = Object.entries(bySource).sort((a, b) => b[1] - a[1])[0];
  const card = (x) => {

function monthEntries(mk) {
  const out = [];
  for (const p of payments()) if (p.pago && monthKey(payDay(p)) === mk) out.push({ tipo: "entrada", data: payDay(p), desc: `${p.desc || "Parcela"} · ${p.job.titulo}`, cat: "Trabalhos", valor: Number(p.valor) || 0, jobId: p.job.id });
  for (const f of all("finance")) if (monthKey(f.data) === mk) out.push({ tipo: f.tipo, data: f.data, desc: f.desc, cat: f.categoria || (f.tipo === "entrada" ? "Outras entradas" : "Outros"), valor: Number(f.valor) || 0, finId: f.id, pago: f.pago !== false });
  return out.sort((a, b) => b.data.localeCompare(a.data));
}
function viewFin() {
  const mk = UI.finMonth; const [y, m] = mk.split("-").map(Number);
  const ents = monthEntries(mk);
  const inc = ents.filter((e) => e.tipo === "entrada" && e.pago !== false).reduce((a, e) => a + e.valor, 0);
  const out = ents.filter((e) => e.tipo === "saida" && e.pago !== false).reduce((a, e) => a + e.valor, 0);
  const pend = payments().filter((p) => !p.pago).sort((a, b) => (a.venc || "9").localeCompare(b.venc || "9"));
  const pendTot = pend.reduce((a, p) => a + (Number(p.valor) || 0), 0);
  const billsDue = all("finance").filter((f) => f.tipo === "saida" && f.pago === false).sort((a, b) => a.data.localeCompare(b.data));
  // gráfico 6 meses
  const months = []; for (let i = 5; i >= 0; i--) { const d = new Date(y, m - 1 - i, 1); months.push(d.getFullYear() + "-" + pad(d.getMonth() + 1)); }
  const series = months.map((k) => { const e = monthEntries(k).filter((x) => x.pago !== false); return [k, e.filter((x) => x.tipo === "entrada").reduce((a, x) => a + x.valor, 0), e.filter((x) => x.tipo === "saida").reduce((a, x) => a + x.valor, 0)]; });
  const max = Math.max(1, ...series.flatMap((s) => [s[1], s[2]]));
  const W = 600, H = 180, bw = 26, gap = W / 6;
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Entradas e saídas dos últimos 6 meses">${series.map(([k, a, b], i) => { const x = i * gap + gap / 2; const ha = (a / max) * (H - 40), hb = (b / max) * (H - 40); return `<rect x="${x - bw - 2}" y="${H - 22 - ha}" width="${bw}" height="${ha}" rx="4" fill="var(--accent)"><title>Entradas ${money(a)}</title></rect><rect x="${x + 2}" y="${H - 22 - hb}" width="${bw}" height="${hb}" rx="4" fill="var(--red)" opacity=".8"><title>Saídas ${money(b)}</title></rect><text x="${x}" y="${H - 6}" text-anchor="middle">${MES[Number(k.slice(5)) - 1]}</text>`; }).join("")}</svg>`;
  const cats = {}; for (const e of ents) if (e.tipo === "saida" && e.pago !== false) cats[e.cat] = (cats[e.cat] || 0) + e.valor;
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]); const cmax = Math.max(1, ...catList.map((c) => c[1]));

/* ================= eventos ================= */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-stop]")) { e.stopPropagation(); return; }
  if (t.closest(".modal-bg")) {
    const oj = t.closest("[data-openjob]"); if (oj) { closeModal(true); editJob(oj.dataset.openjob); return; }
    const oq = t.closest("[data-openquote]"); if (oq) { closeModal(true); editQuote(oq.dataset.openquote); return; }
    const ms = t.closest("[data-msg]"); if (ms) { closeModal(true); showMessages(ms.dataset.msg); return; }
    return;
  }
  const side = $("#side");
  if (t.closest("[data-menu]")) { side.classList.add("open"); $("[data-scrim]").classList.add("on"); return; }
  if (t.closest("[data-scrim]") || t.closest(".nav a")) { if (side) side.classList.remove("open"); const sc = $("[data-scrim]"); if (sc) sc.classList.remove("on"); }

  const a = t.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "newJob") return editJob(null);
    if (act === "newQuote") return editQuote(null);
    if (act === "newClient") return editClient(null);
    if (act === "newFin") return editFin(null, a.dataset.tipo);
    if (act === "newPrice") return editPrice(null);
    if (act === "newPrompt") return editPrompt(null);
    if (act === "newNote") return editNote(null);
    if (act === "logout") { if (confirm("Sair deste aparelho?")) logout(); return; }
    if (act === "export") { const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), data: DB.data }, null, 1)], { type: "application/json" }); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = "painel-backup-" + today() + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
  }
  const paid = t.closest("[data-paid]");
  if (paid) { e.stopPropagation(); const [jid, pid] = paid.dataset.paid.split("|"); const j = get("jobs", jid); const p = (j.pagamentos || []).find((x) => x.id === pid); if (p) { p.pago = true; p.pagoEm = today(); save("jobs", j); toast(`${money(p.valor)} recebido`); } return; }
  const bp = t.closest("[data-billpaid]");
  if (bp) { e.stopPropagation(); const f = get("finance", bp.dataset.billpaid); f.pago = true; save("finance", f); return; }
  const tk = t.closest("[data-task]");
  if (tk) { const k = get("tasks", tk.dataset.task); k.feita = !k.feita; k.feitaEm = k.feita ? Date.now() : null; save("tasks", k); return; }
  const et = t.closest("[data-edittask]"); if (et) return editTask(et.dataset.edittask);
  const al = t.closest("[data-alert]"); if (al) { const x = alerts()[Number(al.dataset.alert)]; if (x) x.go(); return; }
  const ui = t.closest("[data-ui]"); if (ui) { UI[ui.dataset.ui] = ui.dataset.v; saveUI(); return render(); }
  const tg = t.closest("[data-toggle]"); if (tg) { UI[tg.dataset.toggle] = !UI[tg.dataset.toggle]; saveUI(); return render(); }
  const mo = t.closest("[data-month]"); if (mo) { const [y, m] = UI.finMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(mo.dataset.month), 1); UI.finMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1); saveUI(); return render(); }
  const nt = t.closest("[data-ntab]"); if (nt) { UI.notesTab = nt.dataset.ntab; saveUI(); return render(); }
  const pc = t.closest("[data-pcat]"); if (pc) { UI.promptCat = pc.dataset.pcat; saveUI(); return render(); }
  const cpp = t.closest("[data-copyprompt]"); if (cpp) return copy(get("prompts", cpp.dataset.copyprompt).texto);
  const th = t.closest("[data-theme]"); if (th) { LS.set("painel_v1_theme", th.dataset.theme); applyTheme(); return render(); }
  const map = [["data-job", editJob], ["data-quote", editQuote], ["data-client", editClient], ["data-fin", editFin], ["data-price", editPrice], ["data-prompt", editPrompt], ["data-note", editNote]];
  for (const [attr, fn] of map) { const el = t.closest(`[${attr}]`); if (el && !t.closest("a,button:not([" + attr + "])")) return fn(el.getAttribute(attr)); }
});
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-input]"); if (!el) return;
  UI[el.dataset.input] = el.value; saveUI(); render();
});
document.addEventListener("change", (e) => {
  const imp = e.target.closest("[data-import]"); if (!imp || !imp.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result); const d = j.data || j; let n = 0;
      if (!confirm("Importar este backup? Itens com o mesmo código serão substituídos pela versão do arquivo.")) return;
      for (const c of COLS) for (const it of Object.values(d[c] || {})) { if (it && it.id) { DB.data[c][it.id] = { ...it, updatedAt: Date.now() }; DB.pending[c + "|" + it.id] = DB.data[c][it.id].updatedAt; n++; } }
      persist(); scheduleFlush(); render(); toast(n + " itens importados");
    } catch { toast("Arquivo inválido"); }
  };
  r.readAsText(imp.files[0]);
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === "quickTask" || kind === "task") {
    const v = f.t.value.trim(); if (!v) return;
    save("tasks", { texto: v, prazo: kind === "quickTask" ? today() : f.d.value || "", feita: false });
    const inp = $(`[data-form="${kind}"] [name="t"]`); if (inp) inp.focus();
  }
  if (kind === "settings") { const s = { ...settings(), id: "main" }; readForm(f, settingsFields(), s); save("settings", s); toast("Ajustes salvos"); }
  if (kind === "lists") { const s = { ...settings(), id: "main" }; const lines = (v) => v.split("\n").map((x) => x.trim()).filter(Boolean); s.catDespesa = lines(f.catDespesa.value); s.origens = lines(f.origens.value); save("settings", s); toast("Listas salvas"); }
  if (kind === "login") {
    DB.key = f.k.value; const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Entrando…";
    DB.mode = "online";
    const ok = await pull();
    if (ok) { LS.set(K.key, DB.key); seed(); render(); flush(); } else if (DB.mode === "online") { DB.mode = "login"; renderLogin("Não consegui conectar. Tente de novo."); }
  }
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pull(); flush(); } });
window.addEventListener("online", () => { pull(); flush(); });

/* ================= início ================= */
(async function boot() {
  applyTheme();
  let ping = null;
  try { const r = await fetch("/api/data", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ op: "ping" }) }); if (r.ok) ping = await r.json(); } catch {}
  if (!ping || !ping.storage || !ping.configured) {
    // Sem servidor configurado (aberto como arquivo, GitHub Pages ou Vercel sem Redis/senha): funciona só neste navegador.
    if (ping && (!ping.storage || !ping.configured) && LS.get(K.mode, "") === "online") { DB.mode = "online"; setSync("err"); }
    else { DB.mode = "local"; LS.set(K.mode, "local"); }
    if (DB.mode === "local") { seed(); render(); return; }
  }
  LS.set(K.mode, "online");
  if (!DB.key) { DB.mode = "login"; return renderLogin(); }
  DB.mode = "online";
  render(); // mostra o que está em cache enquanto busca
  if (await pull()) { seed(); render(); flush(); }
})();
setInterval(() => { if (DB.mode === "online" && !document.hidden) { pull(); flush(); } }, 30000);
</script>
