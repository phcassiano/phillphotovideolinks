# /etc/nginx/sites-available/linknabio
# Depois: ln -s ../sites-available/linknabio /etc/nginx/sites-enabled/
#         certbot --nginx -d links.seudominio.com.br
server {
    listen 80;
    listen [::]:80;
    server_name links.seudominio.com.br;

    # Sem log de acesso com IP: o clicks.log já basta.
    access_log off;

    gzip on;
    gzip_types text/html text/plain image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
