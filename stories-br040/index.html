<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota BR-040</title>
<meta name="description" content="Animação em formato stories: mapa 3D de Brasília ao Rio de Janeiro pela BR-040, passando por Belo Horizonte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080f;
    --ink: #ffffff;
    --ink-soft: rgba(255,255,255,.72);
    --accent: #ffb627;
    --accent-2: #ff6b3d;
    --glass: rgba(8,14,26,.55);
    --line: rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    font-family: "Archivo", system-ui, sans-serif;
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Palco 9:16 */
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    overflow: hidden;
    background: linear-gradient(#0b1626 0%, #1d3049 45%, #1d3049 100%);
    --u: 1px;
    cursor: pointer;
    user-select: none;
  }
  body.capture #stage { width: 1080px; height: 1920px; cursor: default; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Vinheta e gradientes de leitura */
  .shade-top, .shade-bottom { position: absolute; left: 0; right: 0; pointer-events: none; }
  .shade-top { top: 0; height: calc(var(--u) * 360); background: linear-gradient(#04060ccc, #04060c00); }
  .shade-bottom { bottom: 0; height: calc(var(--u) * 760); background: linear-gradient(#04060c00, #04060cf0 75%); }
  .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--u)*260) rgba(0,0,0,.65); }

  /* Barras de progresso dos stories */
  .bars { position: absolute; top: calc(var(--u)*28); left: calc(var(--u)*28); right: calc(var(--u)*28); display: flex; gap: calc(var(--u)*10); }
  .bar { flex: 1; height: calc(var(--u)*7); border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: #fff; border-radius: inherit; }

  .header { position: absolute; top: calc(var(--u)*62); left: calc(var(--u)*32); right: calc(var(--u)*32); display: flex; align-items: center; gap: calc(var(--u)*20); }
  .avatar {
    width: calc(var(--u)*88); height: calc(var(--u)*88); border-radius: 50%;
    padding: calc(var(--u)*5);
    background: conic-gradient(from 200deg, var(--accent), var(--accent-2), #c13584, var(--accent));
    flex: none;
  }
  .avatar div {
    width: 100%; height: 100%; border-radius: 50%; background: #0b1424;
    border: calc(var(--u)*4) solid #0b1424;
    display: grid; place-items: center;
  }
  .avatar svg { width: 62%; height: 62%; }
  .who b { display: block; font-size: calc(var(--u)*34); font-weight: 800; letter-spacing: -.01em; }
  .who span { font-size: calc(var(--u)*26); color: var(--ink-soft); font-weight: 400; }

  /* Placa BR-040 */
  .shield {
    position: absolute; top: calc(var(--u)*190); right: calc(var(--u)*36);
    width: calc(var(--u)*150); height: calc(var(--u)*170);
    filter: drop-shadow(0 calc(var(--u)*10) calc(var(--u)*24) rgba(0,0,0,.5));
  }

  /* Rótulos 3D das cidades */
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center; white-space: nowrap;
    will-change: transform, opacity;
  }
  .lbl .tag {
    font-size: calc(var(--u)*24); font-weight: 600; padding: calc(var(--u)*6) calc(var(--u)*14);
    border-radius: calc(var(--u)*10); background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lbl.major .tag {
    font-size: calc(var(--u)*34); font-weight: 900; padding: calc(var(--u)*10) calc(var(--u)*22);
    background: var(--accent); color: #1a1000; border: none; letter-spacing: -.01em;
  }
  .lbl .stem { width: 2px; height: calc(var(--u)*34); background: linear-gradient(var(--line), rgba(255,255,255,0)); }
  .lbl.major .stem { height: calc(var(--u)*60); background: linear-gradient(var(--accent), rgba(255,182,39,0)); width: 3px; }

  /* Título de abertura */
  .intro { position: absolute; left: calc(var(--u)*64); right: calc(var(--u)*64); bottom: calc(var(--u)*330); }
  .intro .kicker { font-size: calc(var(--u)*30); font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
  .intro h1 { font-size: calc(var(--u)*124); line-height: .92; font-weight: 900; letter-spacing: -.03em; margin-top: calc(var(--u)*18); }
  .intro h1 em { font-style: normal; color: var(--accent); }
  .intro p { font-size: calc(var(--u)*34); color: var(--ink-soft); margin-top: calc(var(--u)*26); }
  .intro .word { display: inline-block; overflow: hidden; vertical-align: top; }
  .intro .word > span { display: inline-block; }

  /* Cartão de etapa */
  .card { position: absolute; left: calc(var(--u)*56); right: calc(var(--u)*56); bottom: calc(var(--u)*310); }
  .card .step { font-size: calc(var(--u)*28); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .card h2 { font-size: calc(var(--u)*96); line-height: .95; font-weight: 900; letter-spacing: -.03em; margin-top: calc(var(--u)*12); }
  .card p { font-size: calc(var(--u)*32); color: var(--ink-soft); margin-top: calc(var(--u)*16); line-height: 1.3; }
  .card { opacity: 0; }

  /* Painel de telemetria */
  .hud {
    position: absolute; left: calc(var(--u)*56); right: calc(var(--u)*56); bottom: calc(var(--u)*96);
    display: flex; gap: calc(var(--u)*18);
  }
  .chip {
    flex: 1; padding: calc(var(--u)*20) calc(var(--u)*26); border-radius: calc(var(--u)*26);
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chip small { display: block; font-size: calc(var(--u)*22); color: var(--ink-soft); letter-spacing: .12em; text-transform: uppercase; }
  .chip b { display: block; font-size: calc(var(--u)*52); font-weight: 900; letter-spacing: -.02em; margin-top: calc(var(--u)*4); font-variant-numeric: tabular-nums; }
  .chip b span { font-size: .5em; font-weight: 600; color: var(--ink-soft); margin-left: .2em; }
  .route-mini { position: relative; height: calc(var(--u)*10); border-radius: 99px; background: rgba(255,255,255,.16); margin-top: calc(var(--u)*20); }
  .route-mini i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .route-mini .dot { position: absolute; top: 50%; width: calc(var(--u)*18); height: calc(var(--u)*18); margin: calc(var(--u)*-9) 0 0 calc(var(--u)*-9); border-radius: 50%; background: #fff; border: calc(var(--u)*3) solid var(--accent); }
  .route-mini .dot.done { background: var(--accent); }

  /* Final */
  .outro { position: absolute; left: 0; right: 0; bottom: calc(var(--u)*330); text-align: center; opacity: 0; }
  .outro .big { font-size: calc(var(--u)*170); font-weight: 900; letter-spacing: -.04em; line-height: .9; }
  .outro .big span { color: var(--accent); }
  .outro p { font-size: calc(var(--u)*34); color: var(--ink-soft); margin-top: calc(var(--u)*18); letter-spacing: .02em; }

  .hint {
    position: absolute; left: 50%; bottom: calc(var(--u)*34); transform: translateX(-50%);
    font-size: calc(var(--u)*22); color: rgba(255,255,255,.5); letter-spacing: .1em; text-transform: uppercase;
  }
  body.capture .hint { display: none; }
  .lbl.region { font-weight: 800; letter-spacing: .32em; color: rgba(255,255,255,.75); font-size: calc(var(--u)*22); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  .credits { position: absolute; left: calc(var(--u)*56); right: calc(var(--u)*56); bottom: calc(var(--u)*62); font-size: calc(var(--u)*15); color: rgba(255,255,255,.45); text-align: left; line-height: 1.3; }
  .paused-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: calc(var(--u)*150); height: calc(var(--u)*150); border-radius: 50%;
    background: rgba(0,0,0,.45); display: none; place-items: center;
  }
  .paused-badge.on { display: grid; }
  .paused-badge::before, .paused-badge::after { content: ""; display: block; }
  .paused-badge span { display: flex; gap: calc(var(--u)*18); }
  .paused-badge span i { width: calc(var(--u)*18); height: calc(var(--u)*60); background: #fff; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id="stage" aria-label="Animação: viagem de Brasília ao Rio de Janeiro pela BR-040">
  <canvas id="gl"></canvas>
  <div class="vignette"></div>
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <div id="labels"></div>

  <div class="bars"><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div></div>
  <div class="header">
    <div class="avatar"><div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffb627" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    </div></div>
    <div class="who"><b>Rota BR-040</b><span>Brasília → BH → Rio</span></div>
  </div>

  <svg class="shield" viewBox="0 0 150 170" aria-hidden="true">
    <path d="M10 8 H140 V96 C140 132 108 154 75 164 C42 154 10 132 10 96 Z" fill="#fff"/>
    <path d="M18 16 H132 V95 C132 126 104 145 75 154 C46 145 18 126 18 95 Z" fill="none" stroke="#111" stroke-width="5"/>
    <rect x="18" y="16" width="114" height="34" fill="#111"/>
    <text x="75" y="42" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-size="25" fill="#fff">BR</text>
    <text x="75" y="108" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-size="50" fill="#111">040</text>
  </svg>

  <div class="intro">
    <div class="kicker"><span class="word"><span>Road trip · 3 capitais</span></span></div>
    <h1><span class="word"><span>Brasília</span></span><br><span class="word"><span><em>ao Rio</em></span></span></h1>
    <p><span class="word"><span>pela BR-040, via Belo Horizonte</span></span></p>
  </div>

  <div class="card" id="card">
    <div class="step" id="cardStep"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
  </div>

  <div class="outro" id="outro">
    <div class="big"><b id="outroKm" style="font-weight:inherit">1.174</b><span> km</span></div>
    <p>Brasília · Belo Horizonte · Rio de Janeiro</p>
  </div>

  <div class="hud">
    <div class="chip" style="flex:1.25">
      <small>Distância</small>
      <b id="km">0<span>km</span></b>
      <div class="route-mini"><i id="miniFill"></i>
        <span class="dot done" style="left:0%"></span>
        <span class="dot" id="dotBH" style="left:62.4%"></span>
        <span class="dot" id="dotRJ" style="left:100%"></span>
      </div>
    </div>
    <div class="chip">
      <small>Próxima</small>
      <b id="next" style="font-size:calc(var(--u)*36); line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Belo Horizonte</b>
    </div>
  </div>

  <div class="credits" id="credits"></div>
  <div class="hint">Toque para pausar</div>
  <div class="paused-badge" id="paused"><span><i></i><i></i></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async () => {
  const CAPTURE = new URLSearchParams(location.search).has('capture');
  if (CAPTURE) document.body.classList.add('capture');

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('gl');

  /* ---------- Dados reais (gerados por tools/build_data.py) ---------- */
  const [META, ROUTE_D, BORDERS, ELEV] = await Promise.all([
    fetch('data/meta.json').then(r => r.json()),
    fetch('data/route.json').then(r => r.json()),
    fetch('data/borders.json').then(r => r.json()),
    fetch('data/elev.bin').then(r => r.arrayBuffer()).then(b => new Int16Array(b))
  ]);
  document.getElementById('credits').textContent = META.credits;

  /* ---------- Projeção (Web Mercator, igual às imagens) ---------- */
  const NPX = 256 * 2 ** META.zoom;
  const LON0 = -45.6, LAT0 = -19.4, K = 10, COSL = Math.cos(LAT0 * Math.PI / 180);
  const PXU = K * COSL / (NPX / 360);          // unidades do mundo por pixel
  const MPU = 111320 / K;                      // metros por unidade
  const VEXAG = 6;                             // exagero vertical do relevo
  const mx = lon => (lon + 180) / 360 * NPX;
  const my = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * NPX; };
  const MX0 = mx(LON0), MY0 = my(LAT0);
  const toXZ = (lat, lon) => ({ x: (mx(lon) - MX0) * PXU, z: (my(lat) - MY0) * PXU });
  const X0 = (META.tx0 * 256 - MX0) * PXU, Z0 = (META.ty0 * 256 - MY0) * PXU;
  const WX = META.sat_px[0] * PXU, WZ = META.sat_px[1] * PXU;
  const [GW, GH] = META.grid;

  function elevAt(x, z) {
    const u = Math.min(GW - 1.001, Math.max(0, (x - X0) / WX * GW - .5));
    const v = Math.min(GH - 1.001, Math.max(0, (z - Z0) / WZ * GH - .5));
    const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j;
    const e = (a, b) => ELEV[b * GW + a];
    return (e(i, j) * (1 - fu) + e(i + 1, j) * fu) * (1 - fv) + (e(i, j + 1) * (1 - fu) + e(i + 1, j + 1) * fu) * fv;
  }
  const heightAt = (x, z) => { const e = elevAt(x, z); return e > 0 ? e * VEXAG / MPU : 0; };

  const CITIES = [
    { name: 'Brasília', lat: -15.794, lon: -47.883, major: true },
    { name: 'Cristalina', lat: -16.768, lon: -47.613 },
    { name: 'Paracatu', lat: -17.222, lon: -46.875 },
    { name: 'João Pinheiro', lat: -17.742, lon: -46.172 },
    { name: 'Três Marias', lat: -18.205, lon: -45.240 },
    { name: 'Sete Lagoas', lat: -19.466, lon: -44.247 },
    { name: 'Belo Horizonte', lat: -19.917, lon: -43.935, major: true },
    { name: 'Conselheiro Lafaiete', lat: -20.660, lon: -43.786 },
    { name: 'Barbacena', lat: -21.226, lon: -43.774 },
    { name: 'Juiz de Fora', lat: -21.764, lon: -43.350 },
    { name: 'Petrópolis', lat: -22.505, lon: -43.178 },
    { name: 'Rio de Janeiro', lat: -22.907, lon: -43.173, major: true }
  ];
  const REGIONS = [
    { name: 'GOIÁS', lat: -16.4, lon: -49.4 }, { name: 'MINAS GERAIS', lat: -18.3, lon: -43.6 },
    { name: 'RIO DE JANEIRO', lat: -22.15, lon: -42.2 }, { name: 'DF', lat: -15.45, lon: -47.45 },
    { name: 'SÃO PAULO', lat: -22.4, lon: -47.6 }, { name: 'BAHIA', lat: -14.3, lon: -43.2 },
    { name: 'OCEANO ATLÂNTICO', lat: -24.0, lon: -41.6 }
  ];

  /* ---------- Three.js ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
  renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1d3049, 0.0075);
  const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.1, 500);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4a5c, 0.85));
  const sun = new THREE.DirectionalLight(0xfff0dc, 0.55);
  sun.position.set(-40, 26, -30); scene.add(sun);

  // Terreno real: relevo SRTM + imagem de satélite em blocos
  const texLoader = new THREE.TextureLoader();
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const [CC, CR] = META.chunks, [CPW, CPH] = META.chunk_px;
  const SEG_PER_PX = 300 / META.sat_px[0];
  const chunkJobs = [];
  for (let r = 0; r < CR; r++) for (let c = 0; c < CC; c++) {
    const px0 = c * CPW, px1 = c === CC - 1 ? META.sat_px[0] : (c + 1) * CPW;
    const py0 = r * CPH, py1 = r === CR - 1 ? META.sat_px[1] : (r + 1) * CPH;
    const w = (px1 - px0) * PXU, d = (py1 - py0) * PXU;
    const geo = new THREE.PlaneGeometry(w, d, Math.round((px1 - px0) * SEG_PER_PX), Math.round((py1 - py0) * SEG_PER_PX));
    geo.rotateX(-Math.PI / 2);
    geo.translate(X0 + px0 * PXU + w / 2, 0, Z0 + py0 * PXU + d / 2);
    const pa = geo.attributes.position;
    for (let i = 0; i < pa.count; i++) pa.setY(i, heightAt(pa.getX(i), pa.getZ(i)));
    geo.computeVertexNormals();
    chunkJobs.push(new Promise(res => texLoader.load(`data/sat_${c}_${r}.jpg`, tex => {
      tex.encoding = THREE.sRGBEncoding; tex.anisotropy = maxAniso;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      const mat = new THREE.MeshLambertMaterial({ map: tex });
      mat.onBeforeCompile = sh => {
        sh.uniforms.uEdge = { value: new THREE.Vector4(X0, Z0, X0 + WX, Z0 + WZ) };
        sh.uniforms.uBase = { value: new THREE.Color(0x0d1a2b).convertSRGBToLinear() };
        sh.vertexShader = 'varying vec2 vWXZ;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vWXZ = (modelMatrix * vec4(position, 1.0)).xz;');
        sh.fragmentShader = 'uniform vec4 uEdge; uniform vec3 uBase; varying vec2 vWXZ;\n' + sh.fragmentShader.replace('#include <tonemapping_fragment>',
          'float edgeD = min(min(vWXZ.x - uEdge.x, uEdge.z - vWXZ.x), min(vWXZ.y - uEdge.y, uEdge.w - vWXZ.y));\n gl_FragColor.rgb = mix(uBase, gl_FragColor.rgb, smoothstep(0.0, 9.0, edgeD));\n#include <tonemapping_fragment>');
      };
      scene.add(new THREE.Mesh(geo, mat));
      res();
    })));
  }
  // Base escura além da área do mapa
  const base = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshBasicMaterial({ color: 0x0d1a2b }));
  base.rotation.x = -Math.PI / 2; base.position.set(X0 + WX / 2, -0.08, Z0 + WZ / 2); scene.add(base);

  // Divisas estaduais
  const borderMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .45 });
  BORDERS.forEach(ring => {
    const v = [];
    for (let k = 0; k < ring.length; k++) {
      const [lon0, lat0] = ring[k], [lon1, lat1] = ring[(k + 1) % ring.length];
      const steps = Math.max(1, Math.ceil(Math.hypot(lon1 - lon0, lat1 - lat0) / 0.02));
      for (let t = 0; t < steps; t++) {
        const p = toXZ(lat0 + (lat1 - lat0) * t / steps, lon0 + (lon1 - lon0) * t / steps);
        v.push(new THREE.Vector3(p.x, heightAt(p.x, p.z) + .035, p.z));
      }
    }
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(v), borderMat));
  });

  // Rota real da BR-040 (OpenStreetMap)
  const raw = ROUTE_D.coords.map(([lon, lat]) => { const p = toXZ(lat, lon); return new THREE.Vector3(p.x, 0, p.z); });
  const flat = new THREE.CatmullRomCurve3(raw, false, 'centripetal');
  const pts = flat.getSpacedPoints(3000).map(p => new THREE.Vector3(p.x, heightAt(p.x, p.z) + 0.07, p.z));
  const curve = new THREE.CatmullRomCurve3(pts);
  const TUB = 3000, RAD = 6;
  const routeGeo = new THREE.TubeGeometry(curve, TUB, 0.03, RAD, false);
  const route = new THREE.Mesh(routeGeo, new THREE.MeshBasicMaterial({ color: 0xffc23d })); scene.add(route);
  const glowGeo = new THREE.TubeGeometry(curve, TUB, 0.075, RAD, false);
  scene.add(new THREE.Mesh(glowGeo, new THREE.MeshBasicMaterial({ color: 0xff7a2f, transparent: true, opacity: .35, depthWrite: false, blending: THREE.AdditiveBlending })));
  // Traço largo, visível só na visão geral
  const wideGeo = new THREE.TubeGeometry(curve, TUB, 0.3, RAD, false);
  const wideMat = new THREE.MeshBasicMaterial({ color: 0xffb627, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
  scene.add(new THREE.Mesh(wideGeo, wideMat));
  // Traçado completo, discreto
  const ghost = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getSpacedPoints(1500)), new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: .2, gapSize: .15, transparent: true, opacity: .55 }));
  ghost.computeLineDistances(); scene.add(ghost);

  function setRouteProgress(p) {
    const n = Math.floor(Math.max(0, Math.min(1, p)) * TUB) * RAD * 6;
    routeGeo.setDrawRange(0, n); glowGeo.setDrawRange(0, n); wideGeo.setDrawRange(0, n);
  }

  // Fração do trajeto em cada cidade
  const samples = curve.getSpacedPoints(4000);
  function fracOf(lat, lon) {
    const q = toXZ(lat, lon); let best = 0, bd = Infinity;
    samples.forEach((s, i) => { const d = (s.x - q.x) ** 2 + (s.z - q.z) ** 2; if (d < bd) { bd = d; best = i; } });
    return best / 4000;
  }
  CITIES.forEach(c => c.f = fracOf(c.lat, c.lon));
  CITIES[0].f = 0; CITIES[CITIES.length - 1].f = 1;
  const F_BH = CITIES.find(c => c.name === 'Belo Horizonte').f;
  const KM_BH = Math.round(ROUTE_D.km_bh), KM_TOTAL = Math.round(ROUTE_D.km_total);
  const fmtKm = n => n.toLocaleString('pt-BR');
  const kmAt = p => p <= F_BH ? KM_BH * p / F_BH : KM_BH + (KM_TOTAL - KM_BH) * (p - F_BH) / (1 - F_BH);
  document.getElementById('dotBH').style.left = (KM_BH / KM_TOTAL * 100) + '%';
  document.getElementById('outroKm').textContent = fmtKm(KM_TOTAL);

  // Marcadores de cidades
  const cityObjs = CITIES.map(c => {
    const p = toXZ(c.lat, c.lon), y = heightAt(p.x, p.z);
    const g = new THREE.Group(); g.position.set(p.x, y, p.z);
    const r = c.major ? .09 : .045;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12), new THREE.MeshBasicMaterial({ color: c.major ? 0xffffff : 0xffe2a8 }));
    dot.position.y = r * .6; g.add(dot);
    const ring = new THREE.Mesh(new THREE.RingGeometry(r * 1.6, r * 2.1, 48), new THREE.MeshBasicMaterial({ color: 0xffb627, transparent: true, opacity: .9, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = .05; g.add(ring);
    if (c.major) {
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(.01, .035, 4, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffb627, transparent: true, opacity: .3, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
      beam.position.y = 2; g.add(beam); g.userData.beam = beam;
    }
    g.userData.ring = ring; scene.add(g);
    const el = document.createElement('div');
    el.className = 'lbl' + (c.major ? ' major' : '');
    el.innerHTML = `<div class="tag">${c.name}</div><div class="stem"></div>`;
    document.getElementById('labels').appendChild(el);
    return { c, g, el, anchor: new THREE.Vector3(p.x, y + (c.major ? .4 : .2), p.z) };
  });
  const regionEls = REGIONS.map(r => {
    const p = toXZ(r.lat, r.lon), el = document.createElement('div');
    el.className = 'lbl region'; el.textContent = r.name; document.getElementById('labels').appendChild(el);
    return { el, anchor: new THREE.Vector3(p.x, heightAt(p.x, p.z) + .3, p.z) };
  });

  // Veículo (marcador luminoso)
  const car = new THREE.Group();
  car.add(new THREE.Mesh(new THREE.SphereGeometry(.06, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(.15, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffb627, transparent: true, opacity: .4, depthWrite: false, blending: THREE.AdditiveBlending }));
  car.add(halo);
  scene.add(car);

  await Promise.all(chunkJobs);

  /* ---------- Estado animado (guiado pela timeline GSAP) ---------- */
  const S = { p: 0, follow: 0, dist: 7, height: 4.2, yaw: 0, side: 0.35, fov: 40, pulse: 0 };
  const OV_POS = new THREE.Vector3(), OV_LOOK = new THREE.Vector3();
  {
    const a = pts[0], b = pts[pts.length - 1];
    const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(.5);
    const dir = new THREE.Vector3().subVectors(b, a).setY(0).normalize();
    // Enquadra o trajeto inteiro na metade superior da tela (vertical 9:16)
    const routePts = curve.getSpacedPoints(120);
    const pv = new THREE.Vector3();
    const setOv = (d, shift) => {
      OV_LOOK.copy(mid).addScaledVector(dir, shift);
      OV_POS.copy(OV_LOOK).addScaledVector(dir, -0.5 * d).setY(d);
    };
    const bounds = () => {
      camera.position.copy(OV_POS); camera.lookAt(OV_LOOK); camera.updateMatrixWorld();
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      routePts.forEach(q => { pv.copy(q).project(camera); x0 = Math.min(x0, pv.x); x1 = Math.max(x1, pv.x); y0 = Math.min(y0, pv.y); y1 = Math.max(y1, pv.y); });
      return { x0, x1, y0, y1 };
    };
    window.__fitOverview = () => {
      let best = null;
      for (let shift = -40; shift <= 40; shift += 1) {
        for (let d = 30; d <= 220; d += 1) {
          setOv(d, shift); const b = bounds();
          if (b.y1 - b.y0 <= .9 && b.x1 - b.x0 <= 1.5 && b.x0 > -.8 && b.x1 < .8 && b.y0 > -.18 && b.y1 < .7) {
            const score = d + Math.abs((b.y0 + b.y1) / 2 - .16) * 40;
            if (!best || score < best.score) best = { score, d, shift };
            break;
          }
        }
      }
      if (best) setOv(best.d, best.shift); else setOv(110, 0);
    };
  }

  const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), camPos = new THREE.Vector3(), look = new THREE.Vector3(), fwd = new THREE.Vector3();
  const proj = new THREE.Vector3();
  let W_PX = 1, H_PX = 1;

  function place(el, anchor, alpha) {
    proj.copy(anchor).project(camera);
    const behind = proj.z > 1;
    const x = (proj.x * .5 + .5) * W_PX, y = (-proj.y * .5 + .5) * H_PX;
    const inside = x > -200 && x < W_PX + 200 && y > H_PX * .13 && y < H_PX + 200;
    el.style.opacity = (!behind && inside) ? alpha : 0;
    el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
  }

  function render(time) {
    const p = Math.min(.9999, Math.max(0, S.p));
    curve.getPointAt(p, v1);
    curve.getPointAt(Math.min(1, p + 0.03), v2);
    fwd.subVectors(v2, v1).setY(0).normalize();
    car.position.copy(v1).add(new THREE.Vector3(0, .06, 0));
    setRouteProgress(p);

    // Câmera de perseguição
    const c = Math.cos(S.yaw), s = Math.sin(S.yaw);
    const bx = -fwd.x, bz = -fwd.z;
    const rx = bx * c - bz * s, rz = bx * s + bz * c;
    const sideX = -fwd.z * S.side, sideZ = fwd.x * S.side;
    const fPos = new THREE.Vector3(v1.x + (rx + sideX) * S.dist, v1.y + S.height, v1.z + (rz + sideZ) * S.dist);
    const fLook = new THREE.Vector3(v1.x + fwd.x * 1.4, v1.y, v1.z + fwd.z * 1.4);
    camPos.copy(OV_POS).lerp(fPos, S.follow);
    look.copy(OV_LOOK).lerp(fLook, S.follow);
    wideMat.opacity = .75 * (1 - S.follow);
    scene.fog.density = 0.0015 + (0.0085 - 0.0015) * S.follow;
    camera.position.copy(camPos); camera.lookAt(look); camera.updateMatrixWorld();
    if (camera.fov !== S.fov) { camera.fov = S.fov; camera.updateProjectionMatrix(); }

    const t = time * .001;
    halo.scale.setScalar(1 + .25 * Math.sin(t * 6));
    cityObjs.forEach(o => {
      const reached = p >= o.c.f - .002;
      const k = (t * .8 + o.c.f * 5) % 1;
      o.g.userData.ring.scale.setScalar(reached ? 1 + k * 2.2 : 1);
      o.g.userData.ring.material.opacity = reached ? .9 * (1 - k) : .25;
      if (o.g.userData.beam) { const fade = Math.min(1, Math.max(0, (camera.position.distanceTo(o.g.position) - 5) / 12)); o.g.userData.beam.material.opacity = (reached ? .3 : .08) * fade; }
      const near = Math.abs(p - o.c.f) < .07;
      const alpha = o.c.major ? (reached || S.follow < .5 ? 1 : .55) : (reached ? (near ? 1 : .7) : (near ? .6 : 0));
      place(o.el, o.anchor, alpha);
    });
    regionEls.forEach(r => place(r.el, r.anchor, .9));

    renderer.render(scene, camera);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W_PX = r.width; H_PX = r.height;
    stage.style.setProperty('--u', (r.width / 1080) + 'px');
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  }
  addEventListener('resize', () => { resize(); __fitOverview(); }); resize(); __fitOverview();

  /* ---------- HUD ---------- */
  const kmEl = document.getElementById('km'), miniFill = document.getElementById('miniFill'), nextEl = document.getElementById('next');
  const bars = [...document.querySelectorAll('.bar i')];
  function updateHud() {
    const km = Math.round(kmAt(Math.min(1, S.p >= .9999 ? 1 : S.p)));
    kmEl.innerHTML = km.toLocaleString('pt-BR') + '<span>km</span>';
    miniFill.style.width = (km / KM_TOTAL * 100) + '%';
    document.getElementById('dotBH').classList.toggle('done', km >= KM_BH);
    document.getElementById('dotRJ').classList.toggle('done', km >= KM_TOTAL);
    const nx = CITIES.find(c => c.f > S.p + .002);
    nextEl.textContent = nx ? nx.name : 'Chegamos!';
  }

  const card = document.getElementById('card');
  function setCard(step, title, text) {
    document.getElementById('cardStep').textContent = step;
    document.getElementById('cardTitle').textContent = title;
    document.getElementById('cardText').textContent = text;
  }

  /* ---------- Timeline (motion) ---------- */
  const STORY = [0, 8.5, 14.5, 21]; // fim de cada story
  const tl = gsap.timeline({ paused: true, onUpdate: () => {
    const t = tl.time();
    bars.forEach((b, i) => { b.style.width = Math.max(0, Math.min(1, (t - STORY[i]) / (STORY[i + 1] - STORY[i]))) * 100 + '%'; });
    updateHud();
  } });

  // Story 1 — abertura e saída de Brasília
  tl.set(card, { opacity: 0 }).set('#outro', { opacity: 0 })
    .fromTo('.intro .word > span', { yPercent: 110 }, { yPercent: 0, duration: .9, stagger: .12, ease: 'power4.out' }, .2)
    .fromTo('.shield', { scale: .4, rotate: -12, opacity: 0 }, { scale: 1, rotate: 0, opacity: 1, duration: .8, ease: 'back.out(2)' }, .5)
    .fromTo('.hud', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: .8, ease: 'power3.out' }, .6)
    .to('.intro .word > span', { yPercent: -110, duration: .6, stagger: .06, ease: 'power3.in' }, 2.6)
    .to(S, { follow: 1, duration: 2.2, ease: 'power3.inOut' }, 2.4)
    .call(() => setCard('Partida · 0 km', 'Brasília', 'Saindo do Planalto Central rumo a Minas Gerais.'), null, 3.0)
    .fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, 3.0)
    .to(card, { opacity: 0, y: -20, duration: .4, ease: 'power2.in' }, 5.6)
    .to(S, { p: F_BH, duration: 6.0, ease: 'power1.inOut' }, 4.0)
    .to(S, { yaw: .5, side: .1, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.2)
    .to(S, { dist: 4.2, height: 2.4, duration: 1.4, ease: 'power2.inOut' }, 8.6)

  // Story 2 — Belo Horizonte
    .call(() => setCard('Parada · ' + fmtKm(KM_BH) + ' km', 'Belo Horizonte', 'Pão de queijo e café entre as serras de Minas.'), null, 9.7)
    .fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, 9.7)
    .to(S, { yaw: '+=2.0', duration: 3.4, ease: 'power1.inOut' }, 10.0)
    .to(card, { opacity: 0, y: -20, duration: .4, ease: 'power2.in' }, 13.4)
    .to(S, { yaw: 0, dist: 6.5, height: 3.6, side: .35, duration: 1.4, ease: 'power2.inOut' }, 13.4)
    .to(S, { p: 1, duration: 5.4, ease: 'power1.inOut' }, 14.0)
    .to(S, { yaw: -.55, side: -.2, duration: 2.7, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 14.2)

  // Story 3 — chegada ao Rio
    .call(() => setCard('Destino · ' + fmtKm(KM_TOTAL) + ' km', 'Rio de Janeiro', 'Serra de Petrópolis, e o mar logo ali.'), null, 17.6)
    .fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, 17.6)
    .to(card, { opacity: 0, y: -20, duration: .4, ease: 'power2.in' }, 19.6)
    .to(S, { follow: 0, duration: 2.0, ease: 'power3.inOut' }, 19.4)
    .fromTo('#outro', { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .8, ease: 'power3.out' }, 20.0)
    .to({}, { duration: 1.0 }, 20.8);
  // A última posição fica pausada brevemente antes de reiniciar
  tl.eventCallback('onComplete', () => { if (!CAPTURE) gsap.delayedCall(.6, () => tl.restart()); });

  // Ajusta duração total ao fim da story 3
  STORY[3] = tl.duration();

  /* ---------- Loop / controles ---------- */
  let last = performance.now();
  function frame(now) { render(now); requestAnimationFrame(frame); }

  if (CAPTURE) {
    window.__duration = tl.duration();
    window.__seek = (t) => { tl.seek(t, false); render(t * 1000); return true; };
    window.__ready = true;
  } else {
    tl.play(0);
    requestAnimationFrame(frame);
    let paused = false;
    stage.addEventListener('click', (e) => {
      const r = stage.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < .25) { // toque à esquerda: story anterior
        const t = tl.time(); const i = Math.max(0, STORY.findIndex((s, k) => t >= s && t < STORY[k + 1]));
        tl.seek(STORY[Math.max(0, i - (t - STORY[i] < 1 ? 1 : 0))]); paused = false; tl.play();
      } else if (x > .75) { // toque à direita: próxima story
        const t = tl.time(); const n = STORY.find(s => s > t + .01);
        if (n === undefined || n >= tl.duration()) tl.restart(); else tl.seek(n);
        paused = false; tl.play();
      } else { paused = !paused; paused ? tl.pause() : tl.play(); }
      document.getElementById('paused').classList.toggle('on', paused);
    });
  }
})();
</script>
</body>
</html>
