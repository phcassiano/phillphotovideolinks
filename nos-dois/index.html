<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de app de celular (máx. 460px), cartões de vidro fosco sobre um degradê menta → pêssego, barra de abas flutuante embaixo. */
:root{
  --bg:#EAF4EF; --glow1:#CDEBDF; --glow2:#FCDCC8;
  --surface:rgba(255,255,255,.62); --surface-solid:#FAFCFB; --surface-2:rgba(255,255,255,.55); --line:rgba(255,255,255,.85); --line-2:rgba(32,74,64,.10);
  --fg:#1F2B28; --muted:#5E6E69; --faint:#93A29D;
  --accent:#137A62; --accent-soft:rgba(46,170,140,.15);
  --ink:#16846B; --ink-fg:#FFFFFF;
  --coral:#C24A2A; --coral-btn:#C94F2E; --coral-soft:rgba(242,120,92,.16);
  --a:#2BB592; --b:#F2785C;
  --hero1:rgba(255,255,255,.72); --hero2:rgba(214,240,230,.65);
  --ok:#137A62; --ok-soft:rgba(46,170,140,.15);
  --warn:#B4651F; --warn-soft:rgba(250,206,160,.45);
  --shadow:0 1px 1px rgba(30,70,60,.04),0 10px 30px rgba(30,70,60,.08);
  --blur:saturate(160%) blur(18px);
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1917; --glow1:#123A31; --glow2:#3A2219;
  --surface:rgba(34,48,45,.62); --surface-solid:#1B2725; --surface-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.08);
  --fg:#EAF3F0; --muted:#A7B9B3; --faint:#6F817B;
  --accent:#5FD4B6; --accent-soft:rgba(95,212,182,.14);
  --ink:#3DBB9B; --ink-fg:#07201A;
  --coral:#FF9479; --coral-btn:#FF9479; --coral-soft:rgba(255,148,121,.14);
  --a:#3DBB9B; --b:#FF9479;
  --hero1:rgba(40,60,55,.75); --hero2:rgba(20,60,50,.6);
  --ok:#5FD4B6; --ok-soft:rgba(95,212,182,.14);
  --warn:#F0B36B; --warn-soft:rgba(240,179,107,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --blur:saturate(140%) blur(18px);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1917; --glow1:#123A31; --glow2:#3A2219;
  --surface:rgba(34,48,45,.62); --surface-solid:#1B2725; --surface-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.08);
  --fg:#EAF3F0; --muted:#A7B9B3; --faint:#6F817B;
  --accent:#5FD4B6; --accent-soft:rgba(95,212,182,.14);
  --ink:#3DBB9B; --ink-fg:#07201A;
  --coral:#FF9479; --coral-btn:#FF9479; --coral-soft:rgba(255,148,121,.14);
  --a:#3DBB9B; --b:#FF9479;
  --hero1:rgba(40,60,55,.75); --hero2:rgba(20,60,50,.6);
  --ok:#5FD4B6; --ok-soft:rgba(95,212,182,.14);
  --warn:#F0B36B; --warn-soft:rgba(240,179,107,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --blur:saturate(140%) blur(18px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 0% 0%,var(--glow1),transparent 72%),radial-gradient(70% 55% at 100% 100%,var(--glow2),transparent 72%),linear-gradient(160deg,var(--glow1) 0%,var(--bg) 45%,var(--glow2) 100%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
em.acc{font-style:normal;color:var(--accent)}
p{margin:0}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-block:6px 18px}
.top .sub{margin-top:4px;color:var(--muted);font-size:14px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(145deg,var(--hero1),var(--hero2));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.big{font-family:var(--display);font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.linkrow{display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px;background:none;border:0;padding:0;color:var(--fg)}
.linkrow svg{width:16px;height:16px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--ink);color:var(--ink-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;box-shadow:0 6px 16px rgba(36,163,134,.28)}
.btn.coral{background:var(--coral-btn);color:var(--ink-fg);box-shadow:0 6px 16px rgba(242,120,92,.3)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.sm{padding:8px 14px;min-height:36px;font-size:14px}
.btn.danger{background:transparent;color:#C8452C;border:1px solid currentColor;box-shadow:none}
.btn svg{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.tile .ic{display:flex;justify-content:space-between;align-items:flex-start;color:var(--faint);margin-bottom:4px}
.tile .ic svg{width:18px;height:18px}
.tile .ic svg:first-child{width:36px;height:36px;padding:8px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.grid2 .tile:nth-child(4n+2) .ic svg:first-child,.grid2 .tile:nth-child(4n+3) .ic svg:first-child{background:var(--coral-soft);color:var(--coral)}
.tile b{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.3}
.tile.wide{grid-column:1/-1}
.pair{display:flex;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;border:3px solid var(--surface-solid);flex:none}
.av.a{background:var(--a)} .av.b{background:var(--b)}
.av.sm{width:26px;height:26px;font-size:11px;border-width:2px}
.av.xs{width:20px;height:20px;font-size:10px;border-width:0}
.pair .heart{width:24px;height:24px;margin-inline:-8px;z-index:1;border-radius:50%;background:var(--surface-solid);display:grid;place-items:center;color:var(--accent)}
.pair .heart svg{width:14px;height:14px;fill:currentColor;stroke:none}
.pair.sm .heart{width:18px;height:18px;margin-inline:-6px}
.pair.sm .heart svg{width:10px;height:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.coral{background:var(--coral-soft);color:var(--coral)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .fa{background:var(--a)} .bar .fb{background:var(--b)} .bar .fx{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.stat{min-width:0}
.stat b{font-family:var(--display);font-size:22px;font-weight:600;display:block;line-height:1.15;overflow-wrap:anywhere}
.stat b.money{font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow-wrap:normal}
.stat b.money small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat span{font-size:12.5px;color:var(--muted)}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.section > .row h2{flex:1}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.task:first-of-type{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px;padding:0}
.chk svg{width:14px;height:14px;stroke-width:3;opacity:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on svg{opacity:1}
.chk.sq{border-radius:8px}
.task .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .m{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.task .m svg{width:13px;height:13px}
.taskbody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 10px 24px rgba(36,163,134,.38)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:436px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 12px 32px rgba(30,70,60,.14)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:18px;font-size:12px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.tab[aria-current="page"] svg{stroke-width:2.2}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=url],textarea,select{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:12px 14px;min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface-solid)}
textarea{resize:vertical;min-height:96px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;background:var(--surface-2)}
.seg input:checked + span{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.answer{background:var(--surface-2);border-radius:14px;padding:12px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.locked{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:500}
.hist{padding:14px 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.hist:first-child{border-top:0}
.hist .q{font-weight:600}
.hist .who{font-weight:600}
.sheetwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,35,30,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:0}
.sheet{position:relative;width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--surface-solid);border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;background:#1F2B28;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-bottom:12px}
.empty{text-align:center;padding:22px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.idea .acts{display:flex;gap:8px;margin-top:12px}
.kid{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left}
.kid .ini{width:46px;height:46px;border-radius:16px;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:20px;flex:none}
.listcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);min-width:0}
.namerow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-2)}
.namerow:first-child{border-top:0}
.namerow .n{font-family:var(--display);font-weight:500;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.hbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);display:grid;place-items:center;color:var(--faint);padding:0}
.hbtn svg{width:16px;height:16px}
.hbtn.on.a{color:var(--a);border-color:var(--a)} .hbtn.on.b{color:var(--b);border-color:var(--b)}
.hbtn.on svg{fill:currentColor}
.hbtn[disabled]{cursor:default}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-pick button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px;border-radius:22px;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);font-weight:600;font-size:16px}
.who-pick .av{width:58px;height:58px;font-size:22px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.hr{height:1px;background:var(--line-2);margin-block:4px}
.week{display:flex;align-items:baseline;gap:6px}
a.btn{text-decoration:none}
.av.ph{background-size:cover;background-position:center;color:transparent}
.recado{display:flex;flex-direction:column;gap:10px}
.recado img,.photo{width:100%;max-height:340px;object-fit:cover;border-radius:16px;display:block}
.seclist{display:flex;flex-direction:column}
.secrow{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:12px 0;border-top:1px solid var(--line-2);text-align:left;font-weight:600;font-size:16px}
.secrow:first-child{border-top:0}
.secrow .iconbtn{color:var(--accent);background:var(--accent-soft);border-color:transparent;box-shadow:none;border-radius:14px}
.secrow small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:600;text-align:left}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.08em;text-align:center;padding:14px;border-radius:14px;background:var(--surface-2);word-break:break-all}
.loyal{border-radius:18px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:110px;box-shadow:var(--shadow)}
.loyal b{font-size:18px}
.loyal .n{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.08em;word-break:break-all}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 12px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.logbtns button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);font-weight:600;font-size:13px}
.logbtns svg{width:22px;height:22px;color:var(--accent)}
.steps .task .t{font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);list-style:none}
details summary::-webkit-details-marker{display:none}
/* Anel de progresso e barras da semana (como no painel de atividade) */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line-2);stroke-width:9}
.ring .pg{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round}
.ring .lb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:600;font-size:20px;line-height:1}
.ring .lb small{display:block;font-family:var(--body);font-weight:500;font-size:10.5px;color:var(--muted);margin-top:3px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend b{margin-left:auto;color:var(--fg);font-weight:600}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.legend i.c{background:var(--coral)} .legend i.g{background:var(--faint)}
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:86px}
.weekbars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekbars i{display:block;width:100%;max-width:14px;border-radius:99px;background:var(--line-2);min-height:10px}
.weekbars i.h1{height:50%;background:rgba(46,170,140,.32)}
.weekbars i.h2{height:100%;background:rgba(46,170,140,.45)}
.weekbars .now i.h1,.weekbars .now i.h2{background:linear-gradient(180deg,#2BB592,#16846B)}
.weekbars i.h0{height:18%}
.weekbars span{font-size:11px;color:var(--faint);font-weight:600}
.weekbars .now span{color:var(--fg)}
.weekbars .now i.h0{outline:2px dashed var(--accent);outline-offset:-2px;background:transparent}
/* Pop-up de novidade do outro (topo da tela) */
.pop{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;width:calc(100% - 24px);max-width:436px;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:22px;background:var(--surface-solid);border:1px solid var(--line);box-shadow:0 16px 40px rgba(20,50,44,.22);animation:popin .28s cubic-bezier(.2,.9,.3,1.2)}
.pop .grow{display:flex;flex-direction:column;gap:3px}
.pop b{font-family:var(--display);font-weight:600;font-size:15px}
.pop p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.pop p.big1{font-family:var(--display);font-weight:500;font-size:17px;color:var(--fg)}
.pop .acts{display:flex;gap:8px;margin-top:8px}
@keyframes popin{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
@media (max-width:360px){.big{font-size:30px} h1{font-size:25px} .ring{width:84px;height:84px}}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; };
const isoN = n => { const d = new Date(n*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const addDays = (s,k) => isoN(dayNum(s)+k);
const addMonths = (s,k) => { const [y,m,d] = s.split("-").map(Number); const last = new Date(y, m-1+k+1, 0).getDate(); const t = new Date(y, m-1+k, Math.min(d,last)); return isoOf(t); };
const diff = (a,b) => dayNum(b) - dayNum(a);
const fmt = (s, o={day:"numeric",month:"short",year:"numeric"}) => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("pt-BR",o); };
const fmtShort = s => fmt(s,{weekday:"short",day:"numeric",month:"short"});
const nf = n => Number(n).toLocaleString("pt-BR");
const money = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});

function ymd(from, to){
  const [y1,m1,d1]=from.split("-").map(Number), [y2,m2,d2]=to.split("-").map(Number);
  let y=y2-y1, m=m2-m1, d=d2-d1;
  if(d<0){ m--; d += new Date(y2, m2-1, 0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {y,m,d};
}
function joinParts(parts){ parts = parts.filter(Boolean); if(parts.length<2) return parts[0]||""; return parts.slice(0,-1).join(", ")+" e "+parts.at(-1); }
function ageText(birth){
  const t = today(); if(diff(birth,t) < 0) return "ainda não nasceu";
  const {y,m,d} = ymd(birth,t);
  if(y>=3) return joinParts([pl(y,"ano","anos"), m?pl(m,"mês","meses"):""]);
  if(y>=1) return joinParts([pl(y,"ano","anos"), m?pl(m,"mês","meses"):""]);
  if(m>=1) return joinParts([pl(m,"mês","meses"), d?pl(d,"dia","dias"):""]);
  return pl(d,"dia","dias");
}
function nextYearly(s){
  const t = today(); const [oy,mm,dd] = s.split("-").map(Number); const ty = Number(t.slice(0,4));
  const mk = y => { const last = new Date(y,mm,0).getDate(); return `${y}-${pad(mm)}-${pad(Math.min(dd,last))}`; };
  let y = ty, n = mk(y); if(diff(t,n) < 0){ y++; n = mk(y); }
  return {date:n, inDays:diff(t,n), turns:y-oy};

      img.onload = () => { const sc = Math.min(1, maxSide/Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width*sc)); cv.height = Math.max(1, Math.round(img.height*sc));

const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
const b64 = buf => { const u = new Uint8Array(buf); let s = ""; for(let i=0;i<u.length;i+=8192) s += String.fromCharCode.apply(null, u.subarray(i, i+8192)); return btoa(s); };

function toB32(bytes){ let bits = "", out = ""; bytes.forEach(b => bits += b.toString(2).padStart(8,"0")); for(let i=0;i<bits.length;i+=5) out += B32[parseInt(bits.slice(i,i+5).padEnd(5,"0"),2)]; return out; }
function fromB32(str){ const clean = String(str||"").toUpperCase().replace(/0/g,"O").replace(/1/g,"I").replace(/8/g,"B").replace(/[^A-Z2-7]/g,""); let bits = ""; for(const ch of clean) bits += B32.indexOf(ch).toString(2).padStart(5,"0"); const out = []; for(let i=0;i+8<=bits.length;i+=8) out.push(parseInt(bits.slice(i,i+8),2)); return new Uint8Array(out); }

async function importKey(raw){ const k = await crypto.subtle.digest("SHA-256", raw); return crypto.subtle.importKey("raw", k, "AES-GCM", false, ["encrypt","decrypt"]); }
async function seal(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
async function unseal(key, box){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, key, unb64(box.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
async function loadVaultKey(){ if(vaultKey) return vaultKey; const raw = lsGet(vaultSlot()); if(!raw) return null; try{ vaultKey = await importKey(unb64(raw)); }catch(e){ vaultKey = null; } return vaultKey; }
async function decryptVault(){
  if(vaultBusy) return; const key = await loadVaultKey(); if(!key) return; vaultBusy = true; let changed = false;
  for(const [id, it] of Object.entries(S.vault)){ const tag = id+":"+it.iv; if(vaultPlain[tag]) continue; try{ vaultPlain[tag] = await unseal(key, it); changed = true; }catch(e){ vaultPlain[tag] = {title:"(não deu para abrir)", text:"Este item foi fechado com outro código."}; changed = true; } }

    ${mode==="cloud" && pushState==="off" && partnerJoined() && lsGet("nd-push-later")!==today() && !(lsGet("nd-push-later")||"").startsWith("x") ? `<section class="card row" style="gap:12px"><span class="iconbtn" style="color:var(--accent);background:var(--accent-soft);border-color:transparent;box-shadow:none">${ic("phone")}</span><div class="grow"><b>Saber na hora</b><p class="small muted">Receba um aviso quando ${esc(pn)} responder ou mandar recado.</p></div><div class="stack" style="gap:6px"><button class="btn sm" data-act="pushOn">Ativar</button><button class="linkrow small muted" data-act="pushLater" style="justify-content:center">Agora não</button></div></section>` : ""}
    <section class="hero stack" style="gap:12px" aria-label="Tempo juntos">

      <button class="tile" data-act="go" data-v="desejos"><span class="ic">${ic("gift")}${ic("chev")}</span><span class="eyebrow">Desejos</span><b>${pl(wishes,"desejo","desejos")}</b><span class="small muted">Ideias de presente</span></button>
      <button class="tile ${fam?"":"wide"}" data-act="go" data-v="contas"><span class="ic">${ic("coin")}${ic("chev")}</span><span class="eyebrow">Contas da casa</span><b>${fixedDueSoon() ? pl(fixedDueSoon(),"conta vencendo","contas vencendo") : Math.abs(bal)<0.01 ? "Tudo certo" : money2(Math.abs(bal))}</b><span class="small muted">${fixedDueSoon() ? "Nos próximos 3 dias" : Math.abs(bal)<0.01 ? (nBills?"Nada a acertar":"Fixas e gastos do mês") : esc(balanceText())}</span></button>
      ${fam ? `<button class="tile" data-act="go" data-v="familia"><span class="ic">${ic("family")}${ic("chev")}</span><span class="eyebrow">Família</span>${fam}</button>` : ""}
      <button class="tile" data-act="go" data-v="decidir"><span class="ic">${ic("vote")}${ic("chev")}</span><span class="eyebrow">Decidir juntos</span><b>${(()=>{ const o = Object.values(S.polls).filter(q=>!(q.votes&&q.votes[me]!=null)).length; return o ? pl(o,"votação","votações") : "Sem pendências"; })()}</b><span class="small muted">Sem um influenciar o outro</span></button>
      <button class="tile" data-act="go" data-v="recado"><span class="ic">${ic("phone")}${ic("chev")}</span><span class="eyebrow">Recado na tela</span><b>${S.meta["recado_"+me] ? "Recado enviado" : "Deixar um recado"}</b><span class="small muted">Aparece no início de ${esc(pn)}</span></button>
      <button class="tile" data-act="go" data-v="radar"><span class="ic">${ic("gift")}${ic("chev")}</span><span class="eyebrow">Radar de presentes</span><b>${(()=>{ const r = radarEvents(); return r[0] ? esc(r[0].title) : "Nada à vista"; })()}</b><span class="small muted">${(()=>{ const r = radarEvents(); return r[0] ? inDaysText(r[0].inDays) : "Datas que pedem presente"; })()}</span></button>
      <button class="tile" data-act="go" data-v="bomsaber"><span class="ic">${ic("info")}${ic("chev")}</span><span class="eyebrow">Bom saber</span><b>Tamanhos e gostos</b><span class="small muted">O que agrada e o que não</span></button>
      <button class="tile wide" data-act="go" data-v="secoes"><span class="ic">${ic("grid")}${ic("chev")}</span><span class="eyebrow">Todas as seções</span><b>Cápsulas, planos, notas, cartões, cofre</b><span class="small muted">E o nosso ano em números</span></button>
    </div>
  </div>`;
}

/* ----- Pergunta do dia ----- */
function pergunta(){
  const t = today(); const q = questionFor(t);
  const mine = ans(t,me), theirs = ans(t,other(me)); const pn = nameOf(other(me));
  const st = streakNow(), best = bestStreak();
  const showForm = !mine || editingAnswer;
  let partner;
  if(theirs && mine) partner = `<div class="answer">${esc(theirs.text)}</div>`;
  else if(theirs) partner = `<div class="locked">${ic("lock")}<span>${esc(pn)} já respondeu. Responda para ver.</span></div>`;
  else partner = `<p class="muted">Ainda não respondeu.</p>`;

  const dates = [...new Set(Object.values(S.answers).map(a=>a.date))].filter(d=>d<t).sort().reverse();
  const hist = dates.map(d => { const a = ans(d,"a"), b = ans(d,"b"); const x = a||b; return {d, q:x.q, theme:x.theme||"", a, b}; })
    .filter(h => histTheme==="Todos" || h.theme===histTheme);

  return `
  <div class="top"><div><h1>Pergunta <em class="acc">do dia</em></h1><p class="sub num">2 minutos por dia · ${pl(st,"dia seguido","dias seguidos")} · Melhor: ${best}</p></div></div>
  <div class="chips" role="group" aria-label="Tom das perguntas" style="margin-bottom:12px"><span class="small muted" style="align-self:center">Tom:</span>${Object.entries(TONES).map(([k,l])=>`<button class="chip" data-act="tone" data-v="${k}" aria-pressed="${((C().tone)||"leve")===k}">${l}</button>`).join("")}</div>
  <section class="card stack" style="gap:14px">
    <div class="row between"><span class="eyebrow" style="color:var(--accent)">Hoje</span><span class="tag">${esc(q.theme)}</span></div>
    <h2>${esc(q.q)}</h2>
    ${showForm ? `<form class="stack" data-form="answer" style="gap:8px">
        <label class="field"><span>Sua resposta</span><textarea id="ans" name="text" maxlength="1000" required placeholder="Escreva com calma…">${mine?esc(mine.text):""}</textarea></label>
        <div class="row between"><span class="small muted">${theirs && !mine ? "A resposta aparece assim que você salvar." : "Só aparece para os dois."}</span><span class="small muted num" id="ansCount">0/1000</span></div>
        <button class="btn block" type="submit">${mine?"Salvar alteração":"Salvar resposta"}</button>
      </form>`
    : `<div class="stack" style="gap:6px"><div class="row between"><span class="small" style="font-weight:600">Você</span><button class="linkrow small" data-act="editAns">${ic("pencil")} Editar</button></div><div class="answer">${esc(mine.text)}</div></div>`}
    <div class="hr"></div>
    <div class="stack" style="gap:6px"><span class="small" style="font-weight:600">${esc(pn)}</span>${partner}${!theirs && mode!=="demo" ? `<div>${waBtn(mine?`Respondi a pergunta de hoje no Nós Dois. Sua vez! ${appUrl()}`:`A pergunta de hoje no Nós Dois é: "${q.q}" Bora responder? ${appUrl()}`, `Chamar ${esc(pn)} no WhatsApp`)}</div>` : ""}</div>
  </section>
  <p class="small muted" style="margin-top:10px">A sequência conta os dias em que os dois respondem. Se um dia passar em branco, ela aguenta uma falta por semana. O tom vale para os próximos dias: a pergunta de hoje não muda.</p>

  <div class="section">
    <div class="row"><h2>Antes</h2></div>
    <div class="chips" role="group" aria-label="Filtrar por tema">${["Todos",...THEMES].map(th=>`<button class="chip" data-act="histTheme" data-v="${esc(th)}" aria-pressed="${histTheme===th}">${esc(th)}</button>`).join("")}</div>
    <div class="card">${hist.length ? hist.map(h=>`<div class="hist">
        <span class="small muted">${esc(fmtShort(h.d))}${h.theme?` · ${esc(h.theme)}`:""}</span>
        <span class="q">${esc(h.q)}</span>
        ${["a","b"].map(s=>{ const x = s==="a"?h.a:h.b; return `<span class="small"><span class="who">${esc(label(s))}:</span> ${x?esc(x.text):`<span class="muted">não respondeu</span>`}</span>`; }).join("")}
      </div>`).join("") : `<div class="empty"><p>As respostas dos dias anteriores aparecem aqui.</p></div>`}</div>
  </div>`;
}

/* ----- Tarefas ----- */
function tarefas(){
  const all = Object.entries(S.tasks).map(([id,t])=>({...t,id}));
  const pn = nameOf(other(me));
  const f = x => taskFilter==="todas" ? true : taskFilter==="minhas" ? (x.who===me||x.who==="ambos") : taskFilter==="dele" ? (x.who===other(me)||x.who==="ambos") : x.who==="ambos";
  const open = all.filter(x=>!x.done && f(x));
  const b = {atrasada:[],hoje:[],semana:[],depois:[],semdata:[]};
  open.forEach(x=>b[bucketOf(x)].push(x));
  Object.values(b).forEach(arr=>arr.sort((x,y)=>(x.due||"9")<(y.due||"9")?-1:1));
  const w = doneThisWeek(); const tot = w.a + w.b;
  const ws = weekStart(); const thanksN = all.filter(x=>x.done && x.doneAt>=ws && x.thanks && Object.values(x.thanks).some(Boolean)).length;
  const summary = `Resumo da semana no Nós Dois: ${nameOf("a")} fez ${w.a} e ${nameOf("b")} fez ${w.b} tarefas. Ainda faltam ${open.length}. Valeu pela parceria!`;
  const pa = tot ? Math.round(w.a/tot*100) : 50;
  const done = all.filter(x=>x.done && f(x)).sort((x,y)=>(y.doneAt||"")<(x.doneAt||"")?-1:1).slice(0,8);
  const groups = [["atrasada","Atrasadas"],["hoje","Hoje"],["semana","Próximos 7 dias"],["depois","Mais para frente"],["semdata","Sem data"]];

  return `
  <div class="top"><div><h1>Tarefas <em class="acc">divididas</em></h1><p class="sub">Quem faz o quê, e até quando</p></div>${pair(true)}</div>
  <div class="chips" role="group" aria-label="Filtrar tarefas" style="margin-bottom:14px">
    ${[["todas","Todas"],["minhas","Minhas"],["dele",`De ${pn}`],["ambos","Dos dois"]].map(([k,l])=>`<button class="chip" data-act="taskFilter" data-v="${k}" aria-pressed="${taskFilter===k}">${esc(l)}</button>`).join("")}
  </div>
  <section class="hero stack" style="gap:12px">
    <h2 class="num">${pl(open.length,"tarefa aberta","tarefas abertas")}</h2>
    <div class="stats num">
      <div class="stat"><b>${b.hoje.length+b.atrasada.length}</b><span>Hoje${b.atrasada.length?` (${b.atrasada.length} atrasada${b.atrasada.length>1?"s":""})`:""}</span></div>
      <div class="stat"><b>${b.semana.length}</b><span>7 dias</span></div>
      <div class="stat"><b>${b.depois.length+b.semdata.length}</b><span>Depois</span></div>
    </div>
    <div class="stack" style="gap:6px">
      <div class="row between small"><span style="font-weight:600">Carga da casa nesta semana</span><span class="muted num">${pl(tot,"feita","feitas")}</span></div>
      <div class="bar" role="img" aria-label="${esc(nameOf("a"))} fez ${w.a}, ${esc(nameOf("b"))} fez ${w.b}">${tot?`<i class="fa" style="width:${pa}%"></i><i class="fb" style="width:${100-pa}%"></i>`:`<i style="width:100%"></i>`}</div>
      <div class="row between small num"><span class="row" style="gap:6px">${avatar("a","xs")} ${esc(nameOf("a"))}: ${w.a}</span><span class="row" style="gap:6px">${esc(nameOf("b"))}: ${w.b} ${avatar("b","xs")}</span></div>
      <div class="row between small" style="flex-wrap:wrap;gap:8px"><span class="muted">${thanksN ? `${pl(thanksN,"tarefa agradecida","tarefas agradecidas")} na semana` : "Agradeça o que o outro fez em Feitas recentemente"}</span>${mode!=="demo" ? waBtn(summary, "Mandar resumo") : ""}</div>
    </div>
  </section>
  ${open.length ? groups.filter(([k])=>b[k].length).map(([k,l])=>`<div class="section"><div class="row"><h3>${l}</h3><span class="small muted">${b[k].length}</span></div><div class="card" style="padding-block:4px">${b[k].map(taskRow).join("")}</div></div>`).join("")
    : `<div class="card empty" style="margin-top:16px"><p>Nada pendente por aqui.</p><button class="btn sm" data-act="newTask">${ic("plus")} Nova tarefa</button></div>`}
  ${done.length ? `<div class="section"><details ${done.some(x=>x.doneBy===other(me) && !(x.thanks&&x.thanks[me]))?"open":""}><summary>Feitas recentemente (${done.length})</summary><div class="card" style="padding-block:4px;margin-top:10px">${done.map(taskRow).join("")}</div></details></div>` : ""}
  <button class="btn fab" data-act="newTask">${ic("plus")} Nova tarefa</button>`;
}
function taskRow(t){
  const whoTxt = t.who==="ambos" ? "Para os dois" : t.who===me ? "Para você" : `Para ${nameOf(t.who)}`;
  const late = !t.done && t.due && diff(today(),t.due) < 0;
  const dueTxt = t.due ? (late ? `<span class="tag warn">${inDaysText(diff(today(),t.due))}</span>` : `<span>${esc(inDaysText(diff(today(),t.due)))}</span>`) : "";
  return `<div class="task ${t.done?"done":""}">
    <button class="chk ${t.done?"on":""}" data-act="toggleTask" data-id="${t.id}" aria-label="${t.done?"Reabrir":"Concluir"}: ${esc(t.title)}">${ic("tick")}</button>
    <button class="taskbody" data-act="editTask" data-id="${t.id}">
      <div class="t">${esc(t.title)}</div>
      <div class="m"><span>${esc(whoTxt)}</span>${t.cat?`<span>· ${esc(t.cat)}</span>`:""}${dueTxt?`<span>·</span>${dueTxt}`:""}${t.repeat?`<span class="row" style="gap:3px">· ${ic("repeat")} ${esc({diaria:"todo dia",semanal:"toda semana",mensal:"todo mês"}[t.repeat])}</span>`:""}</div>
    </button>
    ${thankBit(t) || (t.who==="ambos" ? pair(true) : avatar(t.who,"sm"))}
  </div>`;
}
function thankBit(t){
  if(!t.done || !t.doneBy) return "";
  if(t.doneBy===other(me)) return t.thanks && t.thanks[me] ? `<span class="tag ok">${ic("heart")} Valeu</span>` : `<button class="btn sm soft" data-act="thank" data-id="${t.id}" aria-label="Agradecer ${esc(nameOf(other(me)))} por: ${esc(t.title)}">${ic("heart")} Valeu</button>`;
  if(t.doneBy===me && t.thanks && t.thanks[other(me)]) return `<span class="tag ok">${esc(nameOf(other(me)))} agradeceu</span>`;
  return "";
}
function taskForm(t={}){
  const who = t.who || me; const pn = nameOf(other(me));
  return `
  <label class="field"><span>O que precisa ser feito?</span><input type="text" id="tTitle" name="title" required maxlength="140" value="${esc(t.title||"")}" placeholder="Ex.: Pagar a conta de luz"></label>
  <div class="field"><span>Quem faz</span><div class="seg">

/* ----- Família ----- */
function familia(){
  const c = C(); const sts = stages();
  const parts = [];
  if(!sts.length || (sts.length===1 && sts[0]==="nao")){
    parts.push(`<section class="card stack"><h3>Filhos não estão nos planos agora?</h3><p class="muted">Tudo bem. Se isso mudar, ou se vocês quiserem conversar sobre o assunto, ativem uma das opções abaixo.</p>
      <div class="seg">${["planejando","esperando","temos"].map(k=>`<button class="btn sm ghost" data-act="addStage" data-v="${k}">${STAGES[k]}</button>`).join("")}</div></section>`);
  }
  if(hasStage("esperando")) parts.push(pregnancySection());
  if(hasStage("temos")) parts.push(kidsSection());
  if(hasStage("temos") && youngKids().length) parts.push(routineSection());
  if(hasStage("planejando")) parts.push(planningSection());
  if(hasStage("planejando") || hasStage("esperando")) parts.push(namesSection());

    const kt = Object.values(S.tasks).filter(t=>t.cat==="Filhos" && !t.done);

const LOG_TYPES = {mamada:["Mamada","bottle"], fralda:["Fralda","drop"], sono:["Soneca","zz"], remedio:["Remédio","pill"]};
function routineSection(){

  const last = k => logs.find(l=>l.type===k);

  const ago = iso => { const m = Math.round((Date.now()-new Date(iso))/60000); return m<60 ? `há ${m} min` : `há ${Math.floor(m/60)}h${pad(m%60)}`; };
  return `<div class="section"><div class="row"><h2>Rotina do bebê</h2></div>

function nthSunday(y, m, n){ const d = new Date(y, m-1, 1); const first = (7 - d.getDay()) % 7; return `${y}-${pad(m)}-${pad(1+first+7*(n-1))}`; }
function radarEvents(){
  const t = today(), y = Number(t.slice(0,4)); const ev = [];
  const add = (title, date, forWho) => { const n = diff(t, date); if(n>=0 && n<=90) ev.push({title, date, inDays:n, forWho}); };
  const yearly = (title, mmdd, forWho) => { let d = `${y}-${mmdd}`; if(diff(t,d)<0) d = `${y+1}-${mmdd}`; add(title, d, forWho); };
  ["a","b"].forEach(s => { const bd = (S.about[s]||{}).birthday; if(bd){ const n = nextYearly(bd); add(`Aniversário de ${nameOf(s)}`, n.date, s); } });
  const c = C(); if(c && c.start){ const n = nextYearly(c.start); add(n.turns>0 ? `${pl(n.turns,"ano","anos")} juntos` : "Aniversário de namoro", n.date, "ambos"); }
  yearly("Dia dos Namorados", "06-12", "ambos"); yearly("Natal", "12-25", "ambos");
  Object.values(S.kids).forEach(k => { if(k.birth && diff(k.birth,t)>=0){ const n = nextYearly(k.birth); add(`Aniversário de ${k.name}`, n.date, "kid"); } });
  if(hasStage("temos")){ [y, y+1].forEach(yy => { add("Dia das Mães", nthSunday(yy,5,2), "ambos"); add("Dia dos Pais", nthSunday(yy,8,2), "ambos"); }); }
  Object.values(S.dates).filter(d=>d.type==="aniversario").forEach(d => { const n = d.yearly ? nextYearly(d.date) : {date:d.date}; add(d.title, n.date, "ambos"); });
  const seen = new Set(); return ev.filter(e => { const k = e.title+e.date; if(seen.has(k)) return false; seen.add(k); return true; }).sort((a,b)=>a.inDays-b.inDays);
}
function radar(){
  const pn = nameOf(other(me)); const ev = radarEvents();
  const pw = Object.values(S.wishes).filter(w=>w.who===other(me) && !w.got).slice(0,4); const ab = S.about[other(me)] || {};
  const sizes = [["shirt","Camiseta"],["pants","Calça"],["shoe","Calçado"],["ring","Anel"]].filter(([k])=>ab[k]).map(([k,l])=>`${l} ${esc(ab[k])}`).join(" · ");
  const hints = `<div class="stack" style="gap:6px;margin-top:6px">${pw.length?`<span class="small"><b>Desejos de ${esc(pn)}:</b> ${pw.map(w=>esc(w.text)).join(", ")}</span>`:""}${sizes?`<span class="small"><b>Tamanhos:</b> ${sizes}</span>`:""}${ab.dislike?`<span class="small"><b>Evitar:</b> ${esc(ab.dislike)}</span>`:""}${!pw.length && !sizes ? `<span class="small muted">Peça para ${esc(pn)} preencher Desejos e Bom saber.</span>`:""}</div>`;
  return `${topBack("Radar de presentes", "O que vem por aí e o que ia dar alegria")}
  ${ev.length ? `<div class="stack">${ev.map(e=>`<section class="card stack" style="gap:4px"><div class="row between"><b>${esc(e.title)}</b><span class="tag ${e.inDays<=14?"acc":""}">${esc(inDaysText(e.inDays))}</span></div><span class="small muted">${esc(fmt(e.date,{weekday:"long",day:"numeric",month:"long"}))}</span>${e.forWho===me ? `<span class="small muted">É o seu. ${esc(pn)} vê as suas ideias aqui.</span>` : hints}</section>`).join("")}</div>`
    : emptyBox("gift","Nada à vista","Quando chegar perto de um aniversário, do aniversário de vocês ou de uma data do calendário, você fica sabendo aqui com antecedência.", `<button class="btn sm ghost" data-act="go" data-v="bomsaber">Pôr meu aniversário em Bom saber</button>`)}`;

const sheetEl = document.getElementById("sheet");
let sheetSubmit = null, sheetReturn = null;
function openSheet(title, body, onSubmit, {submit="Salvar", extra=""}={}){
  sheetReturn = document.activeElement;
  sheetEl.innerHTML = `<div class="sheetwrap" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="scrim" data-act="closeSheet" aria-label="Fechar" tabindex="-1"></button>
    <form class="sheet" id="sheetForm"><div class="grab"></div><div class="row between"><h2>${esc(title)}</h2><button type="button" class="btn sm ghost" data-act="closeSheet">Fechar</button></div>
    ${body}${onSubmit?`<button class="btn block" type="submit">${esc(submit)}</button>`:""}${extra}</form></div>`;
  sheetEl.hidden = false; sheetSubmit = onSubmit;
  const f = sheetEl.querySelector("input[type=text],textarea,input[type=date],input[type=number]"); if(f) setTimeout(()=>f.focus({preventScroll:true}), 60);
}
function closeSheet(){ sheetEl.hidden = true; sheetEl.innerHTML = ""; sheetSubmit = null; if(sheetReturn && document.contains(sheetReturn)) sheetReturn.focus({preventScroll:true}); }
const delBtn = (act, id) => `<button type="button" class="btn danger block" data-act="${act}" data-id="${id}">${ic("trash")} Excluir</button>`;

  settle: () => { Object.entries(S.bills).filter(([,b])=>!b.settled && ownerOf(b)!==b.paidBy).forEach(([id,b])=>put("bills", id, {...b, settled:true, settledAt:today()})); toast("Contas acertadas"); },
  newFixed: () => openSheet("Nova conta fixa", fixedForm(), fd => { const v = parseMoney(fd.amount); const day = Math.min(31, Math.max(1, parseInt(fd.dueDay,10)||1));
    put("fixed", uid(), {title:fd.title.trim(), amount:v>0?Math.round(v*100)/100:null, dueDay:day, owner:fd.owner||"casal", category:fd.category||"Contas", paid:{}, at:new Date().toISOString()}); toast("Conta fixa cadastrada"); }, {submit:"Cadastrar"}),
  editFixed: el => { const id = el.dataset.id, f = S.fixed[id]; if(!f) return;
    openSheet("Editar conta fixa", fixedForm(f), fd => { const v = parseMoney(fd.amount); const day = Math.min(31, Math.max(1, parseInt(fd.dueDay,10)||1));
      put("fixed", id, {...f, title:fd.title.trim(), amount:v>0?Math.round(v*100)/100:null, dueDay:day, owner:fd.owner, category:fd.category}); }, {extra:delBtn("delFixed", id)}); },
  delFixed: el => { if(!armed(el)) return; del("fixed", el.dataset.id); closeSheet(); toast("Conta fixa removida. Os pagamentos já anotados continuam."); },
  payFixed: el => { const id = el.dataset.id, m = el.dataset.m, f = S.fixed[id]; if(!f) return; const pn = nameOf(other(me));
    const dflt = m===monthOf(today()) ? today() : `${m}-${pad(Math.min(Number(f.dueDay)||1, 28))}`;
    openSheet(`Pagar: ${f.title}`, `<label class="field"><span>Valor pago (R$)</span><input type="text" inputmode="decimal" id="pAmount" name="amount" required value="${f.amount!=null?String(f.amount).replace(".",","):""}"></label>
      <div class="field"><span>Quem pagou</span><div class="seg">${[[me,"Eu"],[other(me),pn]].map(([v,l])=>`<label><input type="radio" name="paidBy" value="${v}" ${v===me?"checked":""}><span>${esc(l)}</span></label>`).join("")}</div></div>
      <label class="field"><span>Data do pagamento</span><input type="date" id="pDate" name="date" value="${dflt}"></label>`,
      fd => { const v = parseMoney(fd.amount); if(!(v>0)){ toast("Informe um valor maior que zero."); return; }

  pushOn: () => pushEnable(),
  pushOff: () => pushDisable(),

  copyCode: el => { const c = fmtCode(codes && codes[el.dataset.s]); try{ navigator.clipboard.writeText(c).then(()=>toast(`Código ${c} copiado`)).catch(()=>toast(`Código: ${c}`)); }catch(e){ toast(`Código: ${c}`); } },
  regenCode: el => { if(!el.dataset.armed){ el.dataset.armed = "1"; el.textContent = "Toque de novo: o atual para de valer"; return; } loadCodes(el.dataset.s); },

  wipeAll: el => { if(!el.dataset.armed){ el.dataset.armed = "1"; el.innerHTML = `${ic("trash")} Toque de novo: apaga tudo, dos dois`; return; }

      if(sp) api({op:"wipe", id:sp.id, key:sp.key}).then(()=>toast("Todos os dados foram apagados.")).catch(()=>toast("Não deu para apagar no servidor. Tente de novo.")); schedule(); return; }
    COLS.forEach(c => Object.keys(S[c]).forEach(id => del(c, id))); lsSet("nd-me", null); me = null; view = "home"; toast("Todos os dados foram apagados."); },
  delKid: el => { if(!armed(el)) return; const id = el.dataset.id; Object.entries(S.journal).filter(([,j])=>j.kidId===id).forEach(([jid])=>del("journal", jid)); del("kids", id); closeSheet(); }

function ageAt(birth, date){ const {y,m} = ymd(birth, date); if(diff(birth,date)<0) return "antes de nascer"; return y ? `${pl(y,"ano","anos")}${m?` e ${pl(m,"mês","meses")}`:""}` : m ? pl(m,"mês","meses") : pl(diff(birth,date),"dia","dias"); }
function wishForm(w){ const pn = nameOf(other(me));
  return `<div class="field"><span>De quem é o desejo</span><div class="seg">${[[me,"Meu"],[other(me),`De ${pn}`]].map(([v,l])=>`<label><input type="radio" name="who" value="${v}" ${w.who===v?"checked":""}><span>${esc(l)}</span></label>`).join("")}</div></div>
  <label class="field"><span>O quê</span><input type="text" id="wText" name="text" required maxlength="120" value="${esc(w.text||"")}" placeholder="Ex.: Aula de cerâmica"></label>
  <label class="field"><span>Detalhes (tamanho, cor, onde comprar)</span><input type="text" id="wNote" name="note" maxlength="200" value="${esc(w.note||"")}"></label>`; }
function kidForm(k){ return `<label class="field"><span>Nome</span><input type="text" id="kName" name="name" required maxlength="40" value="${esc(k.name||"")}"></label>
  <label class="field"><span>Data de nascimento</span><input type="date" id="kBirth" name="birth" required value="${esc(k.birth||"")}"></label>`; }

const FORMS = {
  recado: (fd, f) => { const text = String(fd.text||"").trim(); if(!text && !recadoPhoto){ toast("Escreva algo ou escolha uma foto."); return; }
    put("meta","recado_"+me,{text, photo:recadoPhoto||null, at:new Date().toISOString()}); recadoPhoto = null; clearIds.add("recText"); f.reset(); toast(`Recado na tela de ${nameOf(other(me))}`); },
  about: fd => { const o = {}; ABOUT_FIELDS.forEach(([k]) => { const v = String(fd[k]||"").trim(); if(v) o[k] = v; }); put("about", me, {...o, at:new Date().toISOString()}); toast("Salvo"); },
  vaultUnlock: (fd, f) => { const raw = fromB32(fd.code); if(raw.length < 20){ toast("Código incompleto. Confira as letras."); return; }
    importKey(raw.slice(0,20)).then(key => unseal(key, S.meta.vault.check).then(() => { lsSet(vaultSlot(), b64(raw.slice(0,20))); vaultKey = key; vaultPlain = {}; toast("Cofre aberto neste celular"); schedule(); }))
      .catch(() => toast("Código não confere. Confira com quem ativou o cofre.")); },
  join: (fd, f) => joinWithCode(fd.code, f.querySelector("input") && f.querySelector("input").id),
  setup: fd => {
    let sts = Object.keys(STAGES).filter(k=>fd["st_"+k]); if(sts.includes("nao") && sts.length>1) sts = sts.filter(s=>s!=="nao");
    me = "a"; lsSet("nd-me","a");
    put("meta","couple",{a:{name:fd.a.trim()}, b:{name:fd.b.trim()}, start:fd.start, stages:sts, dueDate:"", goal:{}, members:myId?{a:myId}:{}, createdAt:new Date().toISOString()});
    view = hasStage("esperando") || hasStage("temos") ? "familia" : "home";
  },
  answer: (fd, f) => { const t = today(); const q = questionFor(t);
    put("answers", `${t}_${me}`, {date:t, slot:me, text:fd.text.trim(), q:q.q, theme:q.theme, at:new Date().toISOString()});
    clearIds.add("ans"); editingAnswer = false;
    if(ans(t,other(me))) toast("Salvo! Agora você pode ler a resposta."); else toast(`Salvo! ${nameOf(other(me))} vai ver depois de responder.`); },
  addItem: (fd, f) => { const id = f.dataset.id; put("items", uid(), {listId:id, text:fd.text.trim(), done:false, at:new Date().toISOString()}); clearIds.add("newItem_"+id); f.reset(); },
  addName: (fd, f) => { const n = fd.name.trim(); if(Object.values(S.names).some(x=>x.name.toLowerCase()===n.toLowerCase())){ toast("Esse nome já está na lista."); return; }
    put("names", uid(), {name:n, likes:{[me]:true}, at:new Date().toISOString(), by:me}); clearIds.add("newName"); f.reset(); },
  setDue: fd => patch("meta","couple",{dueDate:fd.due}),
  settings: fd => {
    let sts = Object.keys(STAGES).filter(k=>fd["st_"+k]); if(sts.includes("nao") && sts.length>1) sts = sts.filter(s=>s!=="nao");
    const c = C(); put("meta","couple",{...c, a:{...(c.a||{}), name:fd.a.trim()}, b:{...(c.b||{}), name:fd.b.trim()}, start:fd.start, stages:sts, dueDate:fd.due||""});
    toast("Ajustes salvos");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el, e);
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  const fd = {}; new FormData(f).forEach((v,k)=>{ fd[k] = v; });
  f.querySelectorAll("input[type=checkbox]").forEach(cb => { if(cb.name) fd[cb.name] = cb.checked; });
  if(f.id === "sheetForm"){ const fn = sheetSubmit; closeSheet(); if(fn) fn(fd, f); schedule(); return; }
  const fn = FORMS[f.dataset.form]; if(fn){ fn(fd, f); schedule(); }
});
document.addEventListener("input", e => { if(e.target.id === "ans"){ const c = document.getElementById("ansCount"); if(c) c.textContent = `${e.target.value.length}/1000`; } });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !sheetEl.hidden) closeSheet(); });
