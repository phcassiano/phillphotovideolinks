<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foco no Pet · Reels</title>
<style>
  :root { --bg: #0e0e0d; --fg: #fff4ea; --accent: #e15a0a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 600 15px/1.4 system-ui, sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  canvas { height: min(80vh, 160vw); aspect-ratio: 9 / 16; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; cursor: pointer; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(100%, calc(min(80vh, 160vw) * 9 / 16)); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 800; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  body.render { padding: 0; gap: 0; } body.render .bar { display: none; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="27" step="0.001" value="0">
  <span id="time">0.0s</span>
</div>
<audio id="music" src="efeitos-foco-no-pet.wav" preload="auto" loop></audio>
<script type="module">
  import { drawFrame, loadAssets, DURATION, FPS } from './reel.js';

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const audio = document.getElementById('music'), btn = document.getElementById('play');
  const seek = document.getElementById('seek'), time = document.getElementById('time');
  const isRender = new URLSearchParams(location.search).has('render');
  if (isRender) document.body.classList.add('render');

  const A = await loadAssets();
  let playing = false, t = 0, t0 = 0, clock0 = 0;
  const draw = () => { drawFrame(ctx, t, A); seek.value = t; time.textContent = t.toFixed(1) + 's'; };

  // Hooks para o render.js (Playwright)
  window.__reel = {
    DURATION, FPS,
    frame: (tt) => { t = tt; drawFrame(ctx, tt, A); return canvas.toDataURL('image/jpeg', 0.95); },
  };
  window.__reelReady = true;
  draw();

  const now = () => (audio.readyState >= 2 && !audio.paused ? audio.currentTime : t0 + (performance.now() - clock0) / 1000);
  function loop() {
    if (!playing) return;
    t = now() % DURATION; draw(); requestAnimationFrame(loop);
  }
  function play() {
    playing = true; btn.textContent = '❚❚ Pausar';
    t0 = t; clock0 = performance.now();
    audio.currentTime = t; audio.play().catch(() => {});
    requestAnimationFrame(loop);
  }
  function pause() { playing = false; btn.textContent = '▶ Play'; audio.pause(); }
  btn.onclick = canvas.onclick = () => (playing ? pause() : play());
  seek.oninput = () => { t = +seek.value; audio.currentTime = t; t0 = t; clock0 = performance.now(); draw(); };
</script>
</body>
</html>
